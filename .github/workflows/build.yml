name: Build Nexus Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/nexus/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

      - name: Write settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NexusBrowser"
          include ':app'
          EOF

      - name: Write root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Write app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.nexus.browser'
              compileSdk 34
              defaultConfig {
                  applicationId "com.nexus.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "3.2.0"
                  multiDexEnabled true
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug { applicationIdSuffix ".debug" }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true }
              packagingOptions {
                  resources.excludes += '/META-INF/{AL2.0,LGPL2.1,DEPENDENCIES,LICENSE,LICENSE.txt,NOTICE,NOTICE.txt}'
                  jniLibs.pickFirsts += ['**/libwg-go.so']
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'com.wireguard.android:tunnel:1.0.20230706'
              implementation 'androidx.annotation:annotation:1.7.1'
              implementation 'androidx.collection:collection:1.4.0'
          }
          EOF

      - name: Write proguard-rules.pro
        run: |
          cat > app/proguard-rules.pro << 'EOF'
          -keep class com.nexus.browser.** { *; }
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }
          -keep class com.wireguard.** { *; }
          -dontwarn com.wireguard.**
          -keep class go.** { *; }
          -dontwarn go.**
          EOF

      - name: Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.DOWNLOAD_WITHOUT_NOTIFICATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:largeHeap="false"
                  android:theme="@style/Theme.NexusBrowser"
                  tools:targetApi="34">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustNothing">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                          <data android:scheme="ftp" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:mimeType="text/html" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="application/xhtml+xml" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="file" />
                          <data android:host="*" />
                          <data android:pathPattern=".*\\.html" />
                          <data android:pathPattern=".*\\.htm" />
                          <data android:pathPattern=".*\\.mhtml" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NexusVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="vpn" />
                  </service>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: Write xml/file_paths.xml
        run: |
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

      - name: Write strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Nexus Browser</string>
              <string name="search_hint">Search or type URL</string>
              <string name="home_search_hint">Search the web</string>
              <string name="menu">Menu</string>
              <string name="back">Back</string>
              <string name="forward">Forward</string>
              <string name="refresh">Refresh</string>
              <string name="home">Home</string>
              <string name="bookmarks">Bookmarks</string>
              <string name="history">History</string>
              <string name="incognito">Incognito</string>
              <string name="settings">Settings</string>
              <string name="new_tab">New Tab</string>
              <string name="close">Close</string>
              <string name="add_bookmark">Add Bookmark</string>
              <string name="remove_bookmark">Remove Bookmark</string>
              <string name="download_started">Download started</string>
              <string name="ad_blocked">Ad blocked</string>
          </resources>
          EOF

      - name: Write colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="primary">#1565C0</color>
              <color name="primary_dark">#0D47A1</color>
              <color name="accent">#00BFA5</color>
              <color name="background">#F5F5F5</color>
              <color name="surface">#FFFFFF</color>
              <color name="text_primary">#212121</color>
              <color name="text_secondary">#757575</color>
              <color name="incognito_color">#311B92</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
              <color name="home_bg_light">#F0F4F8</color>
              <color name="vpn_on">#00C853</color>
              <color name="vpn_off">#F44336</color>
              <color name="tab_strip_bg">#0D47A1</color>
              <color name="bottom_bar">#FFFFFF</color>
              <color name="code_bg">#1E1E1E</color>
              <color name="mem_ok">#4CAF50</color>
              <color name="mem_warn">#FF9800</color>
              <color name="mem_high">#F44336</color>
          </resources>
          EOF

      - name: Write themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.NexusBrowser" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:statusBarColor">@color/primary_dark</item>
                  <item name="android:windowLightStatusBar" tools:targetApi="m">false</item>
                  <item name="android:navigationBarColor">@color/primary_dark</item>
              </style>
          </resources>
          EOF

