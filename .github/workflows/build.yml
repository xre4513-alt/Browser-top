              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              // ===== MediaStore-based public Downloads save =====
              private fun saveBytesToDownloads(bytes: ByteArray, filename: String, mime: String): String? {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, filename)
                              put(MediaStore.MediaColumns.MIME_TYPE, mime)
                              put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/NexusDownloads")
                          }
                          val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          if (uri != null) {
                              contentResolver.openOutputStream(uri)?.use { it.write(bytes) }
                              "Download/NexusDownloads/$filename"
                          } else fallbackSaveBytes(bytes, filename)
                      } else fallbackSaveBytes(bytes, filename)
                  } catch (e: Exception) {
                      e.printStackTrace()
                      fallbackSaveBytes(bytes, filename)
                  }
              }
              private fun fallbackSaveBytes(bytes: ByteArray, filename: String): String? {
                  return try {
                      val publicDl = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                      val nexusDir = File(publicDl, "NexusDownloads")
                      if (!nexusDir.exists()) nexusDir.mkdirs()
                      val out = File(nexusDir, filename)
                      FileOutputStream(out).use { it.write(bytes) }
                      out.absolutePath
                  } catch (e: Exception) {
                      try {
                          val appDir = File(getExternalFilesDir(null), "NexusDownloads")
                          if (!appDir.exists()) appDir.mkdirs()
                          val out = File(appDir, filename)
                          FileOutputStream(out).use { it.write(bytes) }
                          out.absolutePath
                      } catch (e2: Exception) { null }
                  }
              }
