      - name: SiteDownloader
        run: |
          cat > app/src/main/java/com/nexus/browser/SiteDownloader.kt << 'KOTEOF'
          package com.nexus.browser
          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import java.io.BufferedOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URI
          import java.net.URL
          import java.util.Date
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream
          class SiteDownloader(private val ctx: Context) {
              data class P(val phase: String, val cur: Int, val tot: Int)
              fun save(pageUrl: String, html: String, cookies: String?, serverInfo: String,
                       onProgress: (P) -> Unit, onDone: (String?, Int, Int) -> Unit) {
                  Thread {
                      try {
                          val host = (Uri.parse(pageUrl).host ?: "site").replace(".", "_")
                          val ts = System.currentTimeMillis()
                          val assets = extractAssets(html, pageUrl)
                          onProgress(P("Found ${assets.size} assets", 0, assets.size))
                          val tmp = File(ctx.cacheDir, "${host}_$ts.zip")
                          var ok = 0; var fail = 0
                          ZipOutputStream(BufferedOutputStream(FileOutputStream(tmp))).use { zos ->
                              zos.putNextEntry(ZipEntry("index.html")); zos.write(html.toByteArray()); zos.closeEntry()
                              val meta = buildString {
                                  appendLine("Nexus Browser Archive"); appendLine("Saved: ${Date()}")
                                  appendLine("URL: $pageUrl"); appendLine("Size: ${html.length} chars"); appendLine()
                                  appendLine("=== SERVER INFO ==="); appendLine(serverInfo); appendLine()
                                  appendLine("=== COOKIES ==="); appendLine(cookies ?: "(none)")
                              }
                              zos.putNextEntry(ZipEntry("_metadata.txt")); zos.write(meta.toByteArray()); zos.closeEntry()
                              val failed = mutableListOf<String>()
                              assets.forEachIndexed { i, u ->
                                  onProgress(P("Downloading", i, assets.size))
                                  try {
                                      val b = dl(u, cookies)
                                      if (b != null && b.isNotEmpty()) {
                                          zos.putNextEntry(ZipEntry("assets/${sanitize(u)}"))
                                          zos.write(b); zos.closeEntry(); ok++
                                      } else { failed.add(u); fail++ }
                                  } catch (e: Exception) { failed.add("$u -> ${e.message}"); fail++ }
                              }
                              if (failed.isNotEmpty()) {
                                  zos.putNextEntry(ZipEntry("_failed.txt"))
                                  zos.write(failed.joinToString("\n").toByteArray()); zos.closeEntry()
                              }
                          }
                          val path = saveToPublicDownloads(tmp, tmp.name, "application/zip")
                          tmp.delete()
                          onDone(path, ok, fail)
                      } catch (e: Exception) { e.printStackTrace(); onDone(null, 0, 0) }
                  }.start()
              }
              private fun saveToPublicDownloads(src: File, filename: String, mime: String): String? {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, filename)
                              put(MediaStore.MediaColumns.MIME_TYPE, mime)
                              put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/NexusDownloads")
                          }
                          val uri = ctx.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          if (uri != null) {
                              ctx.contentResolver.openOutputStream(uri)?.use { out -> src.inputStream().use { it.copyTo(out) } }
                              "Download/NexusDownloads/$filename"
                          } else fallbackSave(src, filename)
                      } else fallbackSave(src, filename)
                  } catch (e: Exception) {
                      e.printStackTrace()
                      fallbackSave(src, filename)
                  }
              }
              private fun fallbackSave(src: File, filename: String): String? {
                  return try {
                      val publicDl = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                      val nexusDir = File(publicDl, "NexusDownloads")
                      if (!nexusDir.exists()) nexusDir.mkdirs()
                      val out = File(nexusDir, filename)
                      src.inputStream().use { ins -> FileOutputStream(out).use { ins.copyTo(it) } }
                      out.absolutePath
                  } catch (e: Exception) {
                      try {
                          val appDir = File(ctx.getExternalFilesDir(null), "NexusDownloads")
                          if (!appDir.exists()) appDir.mkdirs()
                          val out = File(appDir, filename)
                          src.inputStream().use { ins -> FileOutputStream(out).use { ins.copyTo(it) } }
                          out.absolutePath
                      } catch (e2: Exception) { null }
                  }
              }
              private fun extractAssets(html: String, base: String): Set<String> {
                  val u = mutableSetOf<String>()
                  val pats = listOf(
                      Regex("""src\s*=\s*["']([^"']+)["']""", RegexOption.IGNORE_CASE),
                      Regex("""<link[^>]+href\s*=\s*["']([^"']+)["']""", RegexOption.IGNORE_CASE),
                      Regex("""url\(['"]?([^'")]+)['"]?\)""", RegexOption.IGNORE_CASE)
                  )
                  pats.forEach { p -> p.findAll(html).forEach { m -> val r = resolve(m.groupValues[1], base); if (r.isNotEmpty()) u.add(r) } }
                  return u.filter { it.startsWith("http") }.take(500).toSet()
              }
              private fun resolve(url: String, base: String): String {
                  val t = url.trim()
                  if (t.isEmpty() || t.startsWith("data:") || t.startsWith("javascript:") || t.startsWith("#") || t.startsWith("mailto:")) return ""
                  if (t.startsWith("http://") || t.startsWith("https://")) return t
                  return try { URI(base).resolve(t).toString() } catch (e: Exception) { "" }
              }
              private fun sanitize(u: String): String {
                  var s = u.replace("https://","").replace("http://","")
                      .replace(Regex("[?&=#]"), "_").replace(Regex("[^a-zA-Z0-9._/-]"), "_")
                  if (s.length > 200) { val ext = s.substringAfterLast('.', ""); s = s.take(190) + "." + ext }
                  return s
              }
              private fun dl(url: String, cookies: String?): ByteArray? = try {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 10000; c.readTimeout = 20000; c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 NexusBrowser/4.0")
                  if (!cookies.isNullOrEmpty()) c.setRequestProperty("Cookie", cookies)
                  c.connect()
                  if (c.responseCode !in 200..299) { c.disconnect(); null }
                  else {
                      val len = c.contentLengthLong
                      if (len > 30_000_000L) { c.disconnect(); null }
                      else { val b = c.inputStream.readBytes(); c.disconnect(); if (b.size > 30_000_000) null else b }
                  }
              } catch (e: Exception) { null }
          }
