              private fun injectUniversalAdBlock() {
                  val js = """
                      (function() {
                          if (window.__nexusAdBlockLoaded) return;
                          window.__nexusAdBlockLoaded = true;
                          var css = '.adsbygoogle,.ad-container,.ad-wrapper,.advertisement,.sponsored,.promoted,[id^="google_ads_"],[id*="ad-slot"],iframe[src*="doubleclick"],iframe[src*="googlesyndication"],iframe[src*="googleadservices"]{display:none !important;height:0 !important;}';
                          var style = document.createElement('style');
                          style.type = 'text/css';
                          style.appendChild(document.createTextNode(css));
                          (document.head || document.documentElement).appendChild(style);
                      })();
                  """.trimIndent()
                  webView.evaluateJavascript(js, null)
              }

              private fun injectYouTubeAdBlock() {
                  val js = """
                      (function() {
                          if (window.__nexusYtBlockLoaded) return;
                          window.__nexusYtBlockLoaded = true;

                          var originalParse = JSON.parse;
                          JSON.parse = function(text, reviver) {
                              var result = originalParse(text, reviver);
                              try {
