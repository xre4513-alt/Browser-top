              private fun toggleBookmark() {
                  val tab = currentTab ?: return
                  val url = tab.url
                  if (url == "about:blank") return
                  val title = tab.title
                  val bm = prefs.getStringSet("bookmarks_set", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  val entry = "$title|$url"
                  val ex = bm.firstOrNull { it.endsWith("|$url") }
                  if (ex != null) { bm.remove(ex); Toast.makeText(this, R.string.remove_bookmark, Toast.LENGTH_SHORT).show() }
                  else { bm.add(entry); Toast.makeText(this, R.string.add_bookmark, Toast.LENGTH_SHORT).show() }
                  prefs.edit().putStringSet("bookmarks_set", bm).apply()
                  updateBookmarkIcon()
              }

              private fun updateBookmarkIcon() {
                  val url = currentTab?.url ?: return
                  val bm = prefs.getStringSet("bookmarks_set", mutableSetOf()) ?: mutableSetOf()
                  val marked = bm.any { it.endsWith("|$url") }
                  findViewById<ImageButton>(R.id.btnBookmark).setImageResource(
