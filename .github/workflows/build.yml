                  wv.evaluateJavascript("(function(){try{return JSON.stringify({title:document.title,url:location.href,host:location.host,protocol:location.protocol,referrer:document.referrer,charset:document.characterSet,size:document.documentElement.outerHTML.length,links:document.links.length,images:document.images.length,scripts:document.scripts.length,forms:document.forms.length});}catch(e){return '{}';}})()") { r ->
                      val s = unesc(r).replace(",", ",\n").replace("{", "{\n").replace("}", "\n}")
                      showCode("Page Info", s)
                  }
              }
              private fun links(wv: WebView) {
                  wv.evaluateJavascript("(function(){try{var a=[];var l=document.querySelectorAll('a[href]');for(var i=0;i<l.length&&i<500;i++){a.push(l[i].href);}return a.join('\\n');}catch(e){return 'ERR: '+e.message;}})()") { r -> showCode("Links", unesc(r)) }
              }
              private fun images(wv: WebView) {
                  wv.evaluateJavascript("(function(){try{var a=[];var im=document.querySelectorAll('img[src]');for(var i=0;i<im.length&&i<500;i++){a.push(im[i].src+'  ['+im[i].naturalWidth+'x'+im[i].naturalHeight+']');}return a.join('\\n');}catch(e){return 'ERR: '+e.message;}})()") { r -> showCode("Images", unesc(r)) }
              }
              private fun scripts(wv: WebView) {
                  wv.evaluateJavascript("(function(){try{var o='=== SCRIPTS ===\\n';var s=document.querySelectorAll('script[src]');for(var i=0;i<s.length;i++){o+=s[i].src+'\\n';}o+='\\n=== CSS ===\\n';var c=document.querySelectorAll('link[rel=\"stylesheet\"]');for(var i=0;i<c.length;i++){o+=c[i].href+'\\n';}return o;}catch(e){return 'ERR: '+e.message;}})()") { r -> showCode("Scripts & Styles", unesc(r)) }
              }
              private fun serverInfo(url: String) {
                  Toast.makeText(this, "Fetching...", Toast.LENGTH_SHORT).show()
                  Thread {
                      val sb = StringBuilder()
                      try {
                          sb.append("URL: $url\n\n")
                          try {
                              val h = Uri.parse(url).host ?: ""
                              sb.append("=== DNS ===\nHost: $h\n")
                              java.net.InetAddress.getAllByName(h).forEachIndexed { i, a -> sb.append("IP ${i+1}: ${a.hostAddress}\n") }
                              sb.append("\n")
                          } catch (e: Exception) { sb.append("DNS err: ${e.message}\n\n") }
                          sb.append("=== HEADERS ===\n")
                          val c = URL(url).openConnection() as HttpURLConnection
                          c.requestMethod = "HEAD"; c.connectTimeout = 10000; c.readTimeout = 10000
                          c.instanceFollowRedirects = false
                          c.setRequestProperty("User-Agent", "Mozilla/5.0 NexusBrowser/4.0")
                          c.connect()
                          sb.append("Status: ${c.responseCode} ${c.responseMessage}\n\n")
                          c.headerFields.forEach { (k, v) -> if (k != null && v != null) v.forEach { sb.append("$k: $it\n") } }
                          c.disconnect()
                          handler.post { showCode("🌐 Server Info", sb.toString()) }
                      } catch (e: Exception) {
                          sb.append("\nERR: ${e.message}")
                          handler.post { showCode("🌐 Server Info", sb.toString()) }
                      }
                  }.start()
              }
              private fun unesc(s: String?): String {
                  if (s == null || s == "null") return ""
                  var x = s
                  if (x.startsWith("\"") && x.endsWith("\"") && x.length > 1) x = x.substring(1, x.length - 1)
                  return x.replace("\\n", "\n").replace("\\t", "\t").replace("\\\"", "\"").replace("\\\\", "\\").replace("\\u003c", "<").replace("\\u003e", ">").replace("\\u0026", "&")
              }
              private fun showCode(title: String, content: String) {
                  val c = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(20, 20, 20, 20) }
                  c.addView(ScrollView(this).apply {
                      addView(TextView(this@MainActivity).apply {
                          text = content; setTextIsSelectable(true)
                          setTextColor(Color.parseColor("#D4D4D4"))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                          typeface = Typeface.MONOSPACE; setPadding(20, 20, 20, 20)
                          background = getDrawable(R.drawable.code_bg)
                      })
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(440))
                  })
                  AlertDialog.Builder(this).setTitle(title).setView(c)
                      .setPositiveButton("Copy") { _, _ ->
                          (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("Nexus", content))
                          Toast.makeText(this, "Copied ${content.length} chars", Toast.LENGTH_SHORT).show()
                      }
                      .setNeutralButton("Share") { _, _ ->
                          val i = Intent(Intent.ACTION_SEND); i.type = "text/plain"; i.putExtra(Intent.EXTRA_TEXT, content)
                          startActivity(Intent.createChooser(i, "Share"))
                      }
                      .setNegativeButton("Close", null).show()
              }
