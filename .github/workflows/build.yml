              private fun toggleVpn() { if (isVpnUp()) stopVpn() else startVpn() }

              private fun isVpnUp(): Boolean = try {
                  val t = wgTunnel ?: return false
                  val b = wgBackend ?: return false
                  b.getState(t) == Tunnel.State.UP
              } catch (e: Throwable) { false }

              private fun startVpn() {
                  val configText = prefs.getString("wg_config", DEFAULT_WG_CONFIG) ?: DEFAULT_WG_CONFIG
                  try {
                      val prepare = VpnService.prepare(this)
                      if (prepare != null) startActivityForResult(prepare, 1001)
                      else connectVpn(configText)
                  } catch (e: Throwable) {
                      Toast.makeText(this, "VPN start error: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001) {
                      if (resultCode == RESULT_OK) {
                          val cfg = prefs.getString("wg_config", DEFAULT_WG_CONFIG) ?: DEFAULT_WG_CONFIG
                          connectVpn(cfg)
                      } else Toast.makeText(this, "VPN permission denied", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun connectVpn(configText: String) {
                  Thread {
                      try {
                          val config = Config.parse(ByteArrayInputStream(configText.toByteArray(Charsets.UTF_8)))
                          val tunnel = NexusTunnel("nexus-warp")
                          val backend = wgBackend ?: GoBackend(applicationContext).also { wgBackend = it }
                          val state = backend.setState(tunnel, Tunnel.State.UP, config)
                          handler.post {
                              if (state == Tunnel.State.UP) {
                                  wgTunnel = tunnel
                                  prefs.edit().putBoolean("vpn_enabled", true).apply()
                                  updateVpnUi()
                                  Toast.makeText(this, "🛡 VPN Connected!", Toast.LENGTH_SHORT).show()
                              } else Toast.makeText(this, "VPN state: $state", Toast.LENGTH_LONG).show()
                          }
                      } catch (e: Throwable) {
                          handler.post { Toast.makeText(this, "VPN failed: ${e.message}", Toast.LENGTH_LONG).show() }
                      }
                  }.start()
              }

              private fun stopVpn() {
                  Thread {
                      try {
                          val t = wgTunnel; val b = wgBackend
                          if (t != null && b != null) b.setState(t, Tunnel.State.DOWN, null)
                          handler.post {
                              wgTunnel = null
                              prefs.edit().putBoolean("vpn_enabled", false).apply()
                              updateVpnUi()
                              Toast.makeText(this, "VPN Disconnected", Toast.LENGTH_SHORT).show()
                          }
                      } catch (e: Throwable) {
                          handler.post { Toast.makeText(this, "VPN stop: ${e.message}", Toast.LENGTH_LONG).show() }
                      }
                  }.start()
              }

              private fun updateVpnUi() {
                  val up = isVpnUp()
                  if (up) {
                      vpnStatusText.text = "PROTECTED"
                      vpnPill.setBackgroundResource(R.drawable.vpn_pill_bg)
                      vpnInfoText.text = "Cloudflare WARP active • Tap to disconnect"
                  } else {
                      vpnStatusText.text = "VPN OFF"
                      vpnPill.setBackgroundResource(R.drawable.vpn_pill_off_bg)
                      vpnInfoText.text = "Cloudflare WARP • Built-in • Free"
                  }
              }

              private fun isAdUrl(url: String): Boolean {
                  val lowerUrl = url.lowercase()
                  val host = try { Uri.parse(url).host?.lowercase() ?: "" } catch (e: Exception) { "" }
                  if (adDomains.any { host == it || host.endsWith(".$it") }) return true
                  if (ytAdPatterns.any { lowerUrl.contains(it) }) return true
                  if (adKeywords.any { lowerUrl.contains(it) }) {
                      if (!lowerUrl.contains("youtube.com/watch") &&
                          !lowerUrl.contains("googlevideo.com/videoplayback") &&
                          !lowerUrl.contains("facebook.com/watch") &&
                          !lowerUrl.contains("instagram.com/p/")) return true
                  }
                  return false
              }

