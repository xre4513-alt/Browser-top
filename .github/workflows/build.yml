              <ProgressBar android:id="@+id/progressBar" style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent" android:layout_height="3dp" android:max="100"
                  android:progressTint="@color/accent" android:visibility="gone" />
              <FrameLayout android:id="@+id/contentContainer" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
                  <LinearLayout android:id="@+id/homeOverlay" android:layout_width="match_parent" android:layout_height="match_parent"
                      android:orientation="vertical" android:gravity="top|center_horizontal"
                      android:background="@color/primary_dark" android:paddingStart="20dp" android:paddingEnd="20dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Nexus" android:textColor="#FFFFFF" android:textSize="42sp" android:textStyle="bold"
                          android:layout_marginTop="100dp" android:layout_marginBottom="8dp" />
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Private • Fast • Secure" android:textColor="#B0C4DE" android:textSize="13sp"
                          android:layout_marginBottom="40dp" />
                      <LinearLayout android:layout_width="match_parent" android:layout_height="54dp"
                          android:orientation="horizontal" android:gravity="center_vertical"
                          android:background="@drawable/search_bg" android:elevation="6dp">
                          <EditText android:id="@+id/homeSearchBar" android:layout_width="match_parent" android:layout_height="match_parent"
                              android:background="@android:color/transparent" android:hint="Search the web"
                              android:textColorHint="#9E9E9E" android:textColor="#212121"
                              android:paddingStart="20dp" android:paddingEnd="20dp" android:imeOptions="actionGo"
                              android:inputType="textUri" android:maxLines="1" android:textSize="15sp" />
                      </LinearLayout>
                      <LinearLayout android:id="@+id/vpnPill" android:layout_width="wrap_content" android:layout_height="36dp"
                          android:orientation="horizontal" android:gravity="center_vertical"
                          android:paddingStart="14dp" android:paddingEnd="14dp" android:layout_marginTop="24dp"
                          android:background="@drawable/pill" android:clickable="true" android:focusable="true">
                          <TextView android:id="@+id/vpnStatusText" android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="🛡 TAP TO CONNECT VPN" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>
                  <TextView android:id="@+id/incognitoBadge" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:layout_gravity="top|end" android:layout_margin="8dp"
                      android:background="@color/incognito" android:paddingHorizontal="10dp" android:paddingVertical="4dp"
                      android:text="INCOGNITO" android:textColor="#FFFFFF" android:textSize="10sp"
                      android:textStyle="bold" android:visibility="gone" />
              </FrameLayout>
              <LinearLayout android:id="@+id/bottomBar" android:layout_width="match_parent" android:layout_height="56dp"
