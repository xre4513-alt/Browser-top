              private fun getData(): Pair<Long, Long> = try {
                  val r = TrafficStats.getUidRxBytes(android.os.Process.myUid())
                  val t = TrafficStats.getUidTxBytes(android.os.Process.myUid())
                  if (r < 0 || t < 0) Pair(0L, 0L)
                  else Pair((r - startRx).coerceAtLeast(0), (t - startTx).coerceAtLeast(0))
              } catch (e: Exception) { Pair(0L, 0L) }
              private fun fmt(b: Long): String = when {
                  b < 1024 -> "$b B"
                  b < 1024L*1024 -> "%.1f KB".format(b / 1024.0)
                  b < 1024L*1024*1024 -> "%.2f MB".format(b / (1024.0*1024))
                  else -> "%.2f GB".format(b / (1024.0*1024*1024))
              }
              private fun updData() {
                  val (r, t) = getData(); val tot = r + t
                  dataIndicator.text = fmt(tot)
                  val mb = tot / (1024.0 * 1024)
                  try { dataIndicator.setTextColor(getColor(when {
                      mb < 20 -> R.color.data_ok
                      mb < 100 -> R.color.data_warn
                      else -> R.color.data_high
                  })) } catch (e: Exception) {}
              }
