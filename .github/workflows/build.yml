name: Build Nexus Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/nexus/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

      - name: Write settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NexusBrowser"
          include ':app'
          EOF

      - name: Write root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Write app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.nexus.browser'
              compileSdk 34
              defaultConfig {
                  applicationId "com.nexus.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ".debug"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true }
              packagingOptions {
                  resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

      - name: Write proguard-rules.pro
        run: |
          cat > app/proguard-rules.pro << 'EOF'
          -keep class com.nexus.browser.** { *; }
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          EOF

      - name: Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.DOWNLOAD_WITHOUT_NOTIFICATION" />

              <queries>
                  <package android:name="com.cloudflare.onedotonedotonedotone" />
                  <package android:name="com.cloudflare.app" />
                  <intent>
                      <action android:name="android.net.VpnService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.NexusBrowser"
                  tools:targetApi="34">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: Write xml/file_paths.xml
        run: |
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

      - name: Write strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Nexus Browser</string>
              <string name="search_hint">Search or type URL</string>
              <string name="home_search_hint">Search the web</string>
              <string name="menu">Menu</string>
              <string name="back">Back</string>
              <string name="forward">Forward</string>
              <string name="refresh">Refresh</string>
              <string name="home">Home</string>
              <string name="bookmarks">Bookmarks</string>
              <string name="history">History</string>
              <string name="incognito">Incognito</string>
              <string name="settings">Settings</string>
              <string name="new_tab">New Tab</string>
              <string name="close">Close</string>
              <string name="add_bookmark">Add Bookmark</string>
              <string name="remove_bookmark">Remove Bookmark</string>
              <string name="download_started">Download started</string>
              <string name="ad_blocked">Ad blocked</string>
          </resources>
          EOF

      - name: Write colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="primary">#1565C0</color>
              <color name="primary_dark">#0D47A1</color>
              <color name="primary_light">#42A5F5</color>
              <color name="accent">#00BFA5</color>
              <color name="background">#F5F5F5</color>
              <color name="background_dark">#121212</color>
              <color name="surface">#FFFFFF</color>
              <color name="surface_dark">#1E1E1E</color>
              <color name="text_primary">#212121</color>
              <color name="text_primary_dark">#FFFFFF</color>
              <color name="text_secondary">#757575</color>
              <color name="divider">#E0E0E0</color>
              <color name="incognito_color">#311B92</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
              <color name="home_bg_light">#F0F4F8</color>
              <color name="vpn_on">#00C853</color>
              <color name="vpn_off">#F44336</color>
          </resources>
          EOF

      - name: Write themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.NexusBrowser" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:statusBarColor">@color/primary_dark</item>
                  <item name="android:windowLightStatusBar" tools:targetApi="m">false</item>
                  <item name="android:navigationBarColor">@color/primary_dark</item>
              </style>
          </resources>
          EOF

      - name: Write ic_launcher.xml
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1565C0" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,20 C35,20 20,35 20,54 C20,73 35,88 54,88 C73,88 88,73 88,54 C88,35 73,20 54,20 Z M54,80 C39.6,80 28,68.4 28,54 C28,39.6 39.6,28 54,28 C68.4,28 80,39.6 80,54 C80,68.4 68.4,80 54,80 Z"/>
              <path android:fillColor="#00BFA5" android:pathData="M54,34 C43,34 34,43 34,54 C34,65 43,74 54,74 C65,74 74,65 74,54 C74,43 65,34 54,34 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M50,44 L50,64 L66,54 Z"/>
          </vector>
          EOF

      - name: Write activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="?android:attr/colorBackground">

              <LinearLayout android:id="@+id/navBar"
                  android:layout_width="match_parent" android:layout_height="44dp"
                  android:orientation="horizontal" android:background="@color/primary"
                  android:gravity="center_vertical" android:paddingStart="4dp" android:paddingEnd="4dp">

                  <ImageButton android:id="@+id/btnBack" android:layout_width="0dp" android:layout_height="40dp" android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_media_previous"
                      android:contentDescription="@string/back" android:scaleType="centerInside" android:tint="@color/white" />
                  <ImageButton android:id="@+id/btnForward" android:layout_width="0dp" android:layout_height="40dp" android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_media_next"
                      android:contentDescription="@string/forward" android:scaleType="centerInside" android:tint="@color/white" />
                  <ImageButton android:id="@+id/btnRefresh" android:layout_width="0dp" android:layout_height="40dp" android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_menu_rotate"
                      android:contentDescription="@string/refresh" android:scaleType="centerInside" android:tint="@color/white" />
                  <ImageButton android:id="@+id/btnMenu" android:layout_width="0dp" android:layout_height="40dp" android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_menu_more"
                      android:contentDescription="@string/menu" android:scaleType="centerInside" android:tint="@color/white" />
              </LinearLayout>

              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:background="@color/primary"
                  android:paddingStart="48dp" android:paddingEnd="48dp" android:paddingBottom="6dp" android:gravity="center">
                  <EditText android:id="@+id/addressBar" android:layout_width="match_parent" android:layout_height="40dp"
                      android:background="@drawable/address_bar_bg" android:hint="@string/search_hint"
                      android:textColorHint="@color/text_secondary" android:textColor="@color/text_primary"
                      android:paddingStart="16dp" android:paddingEnd="16dp" android:imeOptions="actionGo"
                      android:inputType="textUri" android:maxLines="1" android:textSize="14sp" />
              </LinearLayout>

              <ProgressBar android:id="@+id/progressBar" style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent" android:layout_height="3dp" android:max="100"
                  android:progressTint="@color/accent" android:visibility="gone" />

              <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
                  <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" />

                  <LinearLayout android:id="@+id/homeOverlay"
                      android:layout_width="match_parent" android:layout_height="match_parent"
                      android:orientation="vertical" android:gravity="center"
                      android:background="@color/home_bg_light" android:visibility="gone">

                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Nexus" android:textColor="@color/primary" android:textSize="42sp"
                          android:textStyle="bold" android:layout_marginBottom="8dp" />
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Private • Fast • Secure" android:textColor="@color/text_secondary"
                          android:textSize="13sp" android:layout_marginBottom="32dp" />

                      <EditText android:id="@+id/homeSearchBar" android:layout_width="match_parent" android:layout_height="52dp"
                          android:layout_marginStart="24dp" android:layout_marginEnd="24dp"
                          android:background="@drawable/home_search_bg" android:hint="@string/home_search_hint"
                          android:textColorHint="@color/text_secondary" android:textColor="@color/text_primary"
                          android:paddingStart="20dp" android:paddingEnd="20dp" android:imeOptions="actionGo"
                          android:inputType="textUri" android:maxLines="1" android:textSize="15sp" android:elevation="4dp" />

                      <TextView android:id="@+id/vpnStatusText"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:layout_marginTop="24dp" android:text="VPN: OFF"
                          android:textColor="@color/vpn_off" android:textSize="12sp" android:textStyle="bold"
                          android:padding="8dp" android:background="?android:attr/selectableItemBackground" />
                  </LinearLayout>

                  <TextView android:id="@+id/incognitoBadge"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:layout_gravity="top|end" android:layout_margin="8dp"
                      android:background="@color/incognito_color" android:paddingHorizontal="10dp" android:paddingVertical="4dp"
                      android:text="INCOGNITO" android:textColor="@color/white" android:textSize="10sp"
                      android:textStyle="bold" android:visibility="gone" />
              </FrameLayout>

              <LinearLayout android:id="@+id/bottomBar"
                  android:layout_width="match_parent" android:layout_height="52dp"
                  android:orientation="horizontal" android:background="@color/primary_dark" android:gravity="center_vertical">

                  <ImageButton android:id="@+id/btnHome" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_menu_view"
                      android:contentDescription="@string/home" android:scaleType="centerInside" android:tint="@color/white" />
                  <ImageButton android:id="@+id/btnBookmark" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless" android:src="@android:drawable/btn_star_big_off"
                      android:contentDescription="@string/bookmarks" android:scaleType="centerInside" android:tint="@color/white" />
                  <ImageButton android:id="@+id/btnTabs" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_menu_agenda"
                      android:contentDescription="@string/new_tab" android:scaleType="centerInside" android:tint="@color/white" />
                  <ImageButton android:id="@+id/btnIncognito" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_menu_crop"
                      android:contentDescription="@string/incognito" android:scaleType="centerInside" android:tint="@color/white" />
                  <ImageButton android:id="@+id/btnSettings" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_menu_preferences"
                      android:contentDescription="@string/settings" android:scaleType="centerInside" android:tint="@color/white" />
              </LinearLayout>
          </LinearLayout>
          EOF

      - name: Write address_bar_bg.xml
        run: |
          cat > app/src/main/res/drawable/address_bar_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
              <corners android:radius="20dp" />
          </shape>
          EOF

      - name: Write home_search_bg.xml
        run: |
          cat > app/src/main/res/drawable/home_search_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
              <corners android:radius="26dp" />
              <stroke android:width="1dp" android:color="#E0E0E0" />
          </shape>
          EOF

      - name: Write MainActivity.kt
        run: |
          cat > app/src/main/java/com/nexus/browser/MainActivity.kt << 'KOTEOF'
          package com.nexus.browser

          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.view.KeyEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.webkit.CookieManager
          import android.webkit.DownloadListener
          import android.webkit.URLUtil
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.EditText
          import android.widget.ImageButton
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.app.AppCompatDelegate
          import java.io.ByteArrayInputStream
          import java.net.URLEncoder

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private lateinit var addressBar: EditText
              private lateinit var homeSearchBar: EditText
              private lateinit var progressBar: ProgressBar
              private lateinit var incognitoBadge: TextView
              private lateinit var homeOverlay: View
              private lateinit var vpnStatusText: TextView
              private lateinit var prefs: SharedPreferences

              private var incognito = false
              private var desktopMode = false
              private var isHomeVisible = true

              private val blockedCount = java.util.concurrent.atomic.AtomicInteger(0)
              private val totalCount = java.util.concurrent.atomic.AtomicInteger(0)

              private val adDomains = setOf(
                  "doubleclick.net","googlesyndication.com","googleadservices.com","adservice.google.com",
                  "ads.google.com","pagead2.googlesyndication.com","partner.googleadservices.com",
                  "tpc.googlesyndication.com","adnxs.com","ads.yahoo.com","advertising.com","outbrain.com",
                  "taboola.com","popads.net","popcash.net","propellerads.com","adcolony.com","applovin.com",
                  "unityads.unity3d.com","chartboost.com","vungle.com","inmobi.com","startapp.com",
                  "mopub.com","flurry.com","adjust.com","appsflyer.com","branch.io","kochava.com",
                  "mixpanel.com","amplitude.com","scorecardresearch.com","quantserve.com","comscore.com",
                  "criteo.com","criteo.net","rubiconproject.com","pubmatic.com","openx.net","indexexchange.com",
                  "casalemedia.com","sharethrough.com","teads.tv","spotxchange.com","smartadserver.com",
                  "adform.net","smaato.net","mobfox.com","yieldmo.com","sonobi.com","gumgum.com",
                  "undertone.com","adroll.com","bidswitch.net","adsrvr.org","bidr.io","liveintent.com",
                  "liveramp.com","mathtag.com","simpli.fi","tapad.com","thetradedesk.com","turn.com",
                  "zemanta.com","yieldlab.net","yieldmanager.com","googletagmanager.com","google-analytics.com",
                  "googletagservices.com","hotjar.com","fullstory.com","mouseflow.com","crazyegg.com",
                  "optimizely.com","vwo.com","kissmetrics.com","segment.com","segment.io","heapanalytics.com",
                  "newrelic.com","bugsnag.com","adzerk.net","ads.linkedin.com","ads.pinterest.com",
                  "ads.reddit.com","ads.twitter.com","ads.tiktok.com","analytics.tiktok.com"
              )

              private val adKeywords = listOf(
                  "/ads/","/advert","/banner/","/popup","/pop-under","/sponsor","/promoted","/affiliate",
                  "/pixel?","/beacon?","adsense","adserver","adtech","/pagead/","/adservice/","/adframe/",
                  "googleads","/advertisement/","/sponsored/","?adid=","&adid="
              )

              private val ytAdPatterns = listOf(
                  "youtube.com/api/stats/ads","youtube.com/pagead","youtube.com/ptracking",
                  "googleads.g.doubleclick.net","youtube.com/pcs/activeview",
                  "youtube.com/youtubei/v1/player/ad","youtube.com/youtubei/v1/next/ad",
                  "youtube.com/youtubei/v1/browse/ad"
              )

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("nexus_browser", Context.MODE_PRIVATE)

                  AppCompatDelegate.setDefaultNightMode(
                      if (prefs.getBoolean("dark_mode", false)) AppCompatDelegate.MODE_NIGHT_YES
                      else AppCompatDelegate.MODE_NIGHT_NO
                  )

                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)
                  addressBar = findViewById(R.id.addressBar)
                  homeSearchBar = findViewById(R.id.homeSearchBar)
                  progressBar = findViewById(R.id.progressBar)
                  incognitoBadge = findViewById(R.id.incognitoBadge)
                  homeOverlay = findViewById(R.id.homeOverlay)
                  vpnStatusText = findViewById(R.id.vpnStatusText)

                  setupWebView()
                  setupButtons()
                  showHomePage()
                  updateVpnStatus()

                  vpnStatusText.setOnClickListener {
                      showVpnDialog()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  updateVpnStatus()
              }

              private fun showHomePage() {
                  isHomeVisible = true
                  homeOverlay.visibility = View.VISIBLE
                  addressBar.setText("")
                  webView.loadUrl("about:blank")
                  updateVpnStatus()
              }

              private fun hideHomePage() {
                  isHomeVisible = false
                  homeOverlay.visibility = View.GONE
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  val s = webView.settings
                  s.javaScriptEnabled = prefs.getBoolean("javascript", true)
                  s.domStorageEnabled = true
                  s.databaseEnabled = true
                  s.loadWithOverviewMode = true
                  s.useWideViewPort = true
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.setSupportZoom(true)
                  s.allowFileAccess = true
                  s.allowContentAccess = true
                  s.javaScriptCanOpenWindowsAutomatically = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.cacheMode = if (incognito) WebSettings.LOAD_NO_CACHE else WebSettings.LOAD_DEFAULT
                  s.userAgentString = s.userAgentString + " NexusBrowser/1.0"

                  CookieManager.getInstance().setAcceptCookie(!incognito)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, !incognito)

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val url = request?.url?.toString() ?: return super.shouldInterceptRequest(view, request)
                          if (prefs.getBoolean("adblock", true)) {
                              totalCount.incrementAndGet()
                              if (isAdUrl(url)) {
                                  blockedCount.incrementAndGet()
                                  return WebResourceResponse("text/plain", "utf-8", ByteArrayInputStream(ByteArray(0)))
                              }
                          }
                          return super.shouldInterceptRequest(view, request)
                      }

                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val url = request?.url?.toString() ?: return false
                          if (prefs.getBoolean("adblock", true) && isAdUrl(url)) return true
                          if (url.startsWith("intent://")) {
                              try {
                                  val i = Intent.parseUri(url, Intent.URI_INTENT_SCHEME)
                                  startActivity(i); return true
                              } catch (e: Exception) { return false }
                          }
                          return false
                      }

                      override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                          super.onPageStarted(view, url, favicon)
                          if (url != null && url != "about:blank") {
                              addressBar.setText(url)
                              if (!incognito) saveHistory(url, view?.title ?: "")
                          }
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          if (!incognito && url != null && url != "about:blank") saveHistory(url, view?.title ?: url)
                          updateBookmarkIcon()
                          if (url == null || url == "about:blank") return
                          if (prefs.getBoolean("adblock", true)) {
                              injectUniversalAdBlock()
                              if (url.contains("youtube.com") || url.contains("youtu.be")) injectYouTubeAdBlock()
                          }
                          if (prefs.getBoolean("hide_identity", false)) injectHideIdentity()
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          progressBar.progress = newProgress
                          progressBar.visibility = if (newProgress in 1..99) View.VISIBLE else View.GONE
                      }
                  }

                  webView.setDownloadListener(DownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                      try {
                          val filename = URLUtil.guessFileName(url, contentDisposition, mimeType)
                          val request = DownloadManager.Request(Uri.parse(url))
                          request.setMimeType(mimeType)
                          request.addRequestHeader("User-Agent", userAgent)
                          request.addRequestHeader("cookie", CookieManager.getInstance().getCookie(url))
                          request.setDescription("Downloading..."); request.setTitle(filename)
                          request.allowScanningByMediaScanner()
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, filename)
                          val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                          dm.enqueue(request)
                          Toast.makeText(this, R.string.download_started, Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Download failed: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  })

                  addressBar.setOnEditorActionListener { _, actionId, event ->
                      if (actionId == EditorInfo.IME_ACTION_GO || event?.keyCode == KeyEvent.KEYCODE_ENTER) {
                          navigate(addressBar.text.toString()); true
                      } else false
                  }

                  homeSearchBar.setOnEditorActionListener { _, actionId, event ->
                      if (actionId == EditorInfo.IME_ACTION_GO || event?.keyCode == KeyEvent.KEYCODE_ENTER) {
                          val q = homeSearchBar.text.toString()
                          if (q.isNotEmpty()) { hideHomePage(); navigate(q); homeSearchBar.clearFocus() }
                          true
                      } else false
                  }
              }

              private fun isAdUrl(url: String): Boolean {
                  val lowerUrl = url.lowercase()
                  val host = try { Uri.parse(url).host?.lowercase() ?: "" } catch (e: Exception) { "" }
                  if (adDomains.any { host == it || host.endsWith(".$it") }) return true
                  if (ytAdPatterns.any { lowerUrl.contains(it) }) return true
                  if (adKeywords.any { lowerUrl.contains(it) }) {
                      if (!lowerUrl.contains("youtube.com/watch") &&
                          !lowerUrl.contains("googlevideo.com/videoplayback") &&
                          !lowerUrl.contains("facebook.com/watch") &&
                          !lowerUrl.contains("instagram.com/p/")) return true
                  }
                  return false
              }

              private fun injectHideIdentity() {
                  val js = """
                      (function() {
                          if (window.__nexusHideIdLoaded) return;
                          window.__nexusHideIdLoaded = true;
                          try { Object.defineProperty(navigator, 'platform', {get: function(){return 'Linux x86_64';}}); } catch(e){}
                          try { Object.defineProperty(navigator, 'vendor', {get: function(){return 'Google Inc.';}}); } catch(e){}
                          try { Object.defineProperty(navigator, 'hardwareConcurrency', {get: function(){return 4;}}); } catch(e){}
                          try { Object.defineProperty(navigator, 'deviceMemory', {get: function(){return 8;}}); } catch(e){}
                          try { Object.defineProperty(navigator, 'languages', {get: function(){return ['en-US','en'];}}); } catch(e){}
                          try { Object.defineProperty(navigator, 'doNotTrack', {get: function(){return '1';}}); } catch(e){}
                          try { Object.defineProperty(navigator, 'plugins', {get: function(){return [];}}); } catch(e){}
                          try {
                              if (window.RTCPeerConnection) window.RTCPeerConnection = undefined;
                              if (window.webkitRTCPeerConnection) window.webkitRTCPeerConnection = undefined;
                          } catch(e){}
                          try {
                              if (navigator.mediaDevices) {
                                  navigator.mediaDevices.enumerateDevices = function(){ return Promise.resolve([]); };
                              }
                          } catch(e){}
                          try {
                              if (navigator.geolocation) {
                                  navigator.geolocation.getCurrentPosition = function(){};
                                  navigator.geolocation.watchPosition = function(){return 0;};
                              }
                          } catch(e){}
                          try {
                              var og = CanvasRenderingContext2D.prototype.getImageData;
                              CanvasRenderingContext2D.prototype.getImageData = function(){
                                  var d = og.apply(this, arguments);
                                  for (var i = 0; i < d.data.length; i += 100) d.data[i] = d.data[i] ^ 1;
                                  return d;
                              };
                          } catch(e){}
                          try {
                              var gp = WebGLRenderingContext.prototype.getParameter;
                              WebGLRenderingContext.prototype.getParameter = function(p){
                                  if (p === 37445) return 'Intel Inc.';
                                  if (p === 37446) return 'Intel Iris OpenGL Engine';
                                  return gp.apply(this, arguments);
                              };
                          } catch(e){}
                          try {
                              var ro = Intl.DateTimeFormat.prototype.resolvedOptions;
                              Intl.DateTimeFormat.prototype.resolvedOptions = function(){
                                  var o = ro.apply(this, arguments); o.timeZone = 'UTC'; return o;
                              };
                          } catch(e){}
                      })();
                  """.trimIndent()
                  webView.evaluateJavascript(js, null)
              }

              private fun injectUniversalAdBlock() {
                  val js = """
                      (function() {
                          if (window.__nexusAdBlockLoaded) return;
                          window.__nexusAdBlockLoaded = true;
                          var css = '.adsbygoogle,.ad-container,.ad-wrapper,.advertisement,.sponsored,.promoted,[id^="google_ads_"],[id*="ad-slot"],iframe[src*="doubleclick"],iframe[src*="googlesyndication"],iframe[src*="googleadservices"]{display:none !important;height:0 !important;}';
                          var style = document.createElement('style');
                          style.type = 'text/css';
                          style.appendChild(document.createTextNode(css));
                          (document.head || document.documentElement).appendChild(style);
                      })();
                  """.trimIndent()
                  webView.evaluateJavascript(js, null)
              }

              private fun injectYouTubeAdBlock() {
                  val js = """
                      (function() {
                          if (window.__nexusYtBlockLoaded) return;
                          window.__nexusYtBlockLoaded = true;
                          var op = JSON.parse;
                          JSON.parse = function(text, reviver) {
                              var r = op(text, reviver);
                              try {
                                  if (r) {
                                      if (r.adPlacements) delete r.adPlacements;
                                      if (r.playerAds) delete r.playerAds;
                                      if (r.adSlots) delete r.adSlots;
                                      if (r.adBreakHeartbeatParams) delete r.adBreakHeartbeatParams;
                                      if (r.playerResponse) {
                                          if (r.playerResponse.adPlacements) delete r.playerResponse.adPlacements;
                                          if (r.playerResponse.playerAds) delete r.playerResponse.playerAds;
                                      }
                                  }
                              } catch(e){}
                              return r;
                          };
                          var css = '.video-ads,.ytp-ad-module,.ytp-ad-overlay-container,.ytp-ad-progress-list,#player-ads,#masthead-ad,ytd-promoted-sparkles-web-renderer,ytd-display-ad-renderer,ytd-ad-slot-renderer,ytd-in-feed-ad-layout-renderer,ytd-action-companion-ad-renderer,ytd-promoted-video-renderer,ytd-compact-promoted-video-renderer,.ytp-ad-image-overlay,.ytp-ad-text-overlay,.ytp-ad-overlay-slot,.ytp-ad-player-overlay,.ytp-featured-product,.ytp-suggested-action,ytd-enforcement-message-view-model{display:none !important;height:0 !important;}';
                          var st = document.createElement('style');
                          st.type = 'text/css';
                          st.appendChild(document.createTextNode(css));
                          (document.head || document.documentElement).appendChild(st);
                          function skip() {
                              document.querySelectorAll('.ytp-ad-skip-button,.ytp-ad-skip-button-modern,.ytp-skip-ad-button').forEach(function(b){try{b.click();}catch(e){}});
                              var v = document.querySelector('video');
                              if (v && document.querySelector('.ad-showing')) {
                                  try { v.currentTime = v.duration; v.playbackRate = 16; } catch(e){}
                              }
                          }
                          setInterval(skip, 250);
                      })();
                  """.trimIndent()
                  webView.evaluateJavascript(js, null)
              }

              private fun navigate(input: String) {
                  val text = input.trim()
                  if (text.isEmpty()) return
                  val url = when {
                      text.startsWith("http://") || text.startsWith("https://") -> text
                      text.contains(".") && !text.contains(" ") -> "https://$text"
                      else -> {
                          val engine = prefs.getString("search_engine", "google") ?: "google"
                          val query = URLEncoder.encode(text, "UTF-8")
                          when (engine) {
                              "duckduckgo" -> "https://duckduckgo.com/?q=$query"
                              "bing" -> "https://www.bing.com/search?q=$query"
                              "brave" -> "https://search.brave.com/search?q=$query"
                              else -> "https://www.google.com/search?q=$query"
                          }
                      }
                  }
                  hideHomePage()
                  webView.loadUrl(url)
              }

              // ====== VPN Integration via System WARP App ======
              private fun isSystemVpnActive(): Boolean {
                  return try {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                          val network = cm.activeNetwork ?: return false
                          val caps = cm.getNetworkCapabilities(network) ?: return false
                          caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN)
                      } else {
                          @Suppress("DEPRECATION")
                          cm.allNetworks.any { n ->
                              @Suppress("DEPRECATION")
                              (cm.getNetworkCapabilities(n)?.hasTransport(NetworkCapabilities.TRANSPORT_VPN) == true)
                          }
                      }
                  } catch (e: Exception) { false }
              }

              private fun updateVpnStatus() {
                  if (isSystemVpnActive()) {
                      vpnStatusText.text = "🛡 VPN: CONNECTED (System)"
                      vpnStatusText.setTextColor(getColor(R.color.vpn_on))
                  } else {
                      vpnStatusText.text = "VPN: OFF (Tap to enable)"
                      vpnStatusText.setTextColor(getColor(R.color.vpn_off))
                  }
              }

              private fun showVpnDialog() {
                  val active = isSystemVpnActive()
                  AlertDialog.Builder(this)
                      .setTitle("VPN Status")
                      .setMessage(
                          if (active) "✅ System VPN is active. All your traffic (including this browser) is routed through Cloudflare WARP."
                          else "❌ VPN is OFF.\n\nNexus Browser uses Cloudflare WARP (free, unlimited) for IP masking.\n\nTap 'Open WARP' to install/open it, then turn it ON. The browser will automatically detect it."
                      )
                      .setPositiveButton(if (active) "OK" else "Open WARP") { _, _ ->
                          if (!active) openWarpApp()
                      }
                      .setNeutralButton("Test IP") { _, _ ->
                          hideHomePage()
                          webView.loadUrl("https://tembrica.com/en/vpn-checker")
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              private fun openWarpApp() {
                  // Try Cloudflare WARP (1.1.1.1)
                  val packages = listOf(
                      "com.cloudflare.onedotonedotonedotone",
                      "com.cloudflare.app"
                  )
                  for (pkg in packages) {
                      val i = packageManager.getLaunchIntentForPackage(pkg)
                      if (i != null) {
                          try { startActivity(i); return } catch (e: Exception) {}
                      }
                  }
                  // Not installed - open Play Store
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW,
                          Uri.parse("market://details?id=com.cloudflare.onedotonedotonedotone")))
                  } catch (e: Exception) {
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW,
                              Uri.parse("https://play.google.com/store/apps/details?id=com.cloudflare.onedotonedotonedotone")))
                      } catch (e2: Exception) {
                          Toast.makeText(this, "Cannot open Play Store", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun setupButtons() {
                  findViewById<ImageButton>(R.id.btnBack).setOnClickListener { if (webView.canGoBack()) webView.goBack() }
                  findViewById<ImageButton>(R.id.btnForward).setOnClickListener { if (webView.canGoForward()) webView.goForward() }
                  findViewById<ImageButton>(R.id.btnRefresh).setOnClickListener { webView.reload() }
                  findViewById<ImageButton>(R.id.btnHome).setOnClickListener { showHomePage() }
                  findViewById<ImageButton>(R.id.btnBookmark).setOnClickListener { toggleBookmark() }
                  findViewById<ImageButton>(R.id.btnTabs).setOnClickListener { showHomePage() }
                  findViewById<ImageButton>(R.id.btnIncognito).setOnClickListener { toggleIncognito() }
                  findViewById<ImageButton>(R.id.btnSettings).setOnClickListener { showSettings() }
                  findViewById<ImageButton>(R.id.btnMenu).setOnClickListener { showMainMenu() }
              }

              private fun toggleBookmark() {
                  val url = webView.url ?: return
                  if (url == "about:blank") return
                  val title = webView.title ?: url
                  val bm = prefs.getStringSet("bookmarks_set", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  val entry = "$title|$url"
                  val ex = bm.firstOrNull { it.endsWith("|$url") }
                  if (ex != null) { bm.remove(ex); Toast.makeText(this, R.string.remove_bookmark, Toast.LENGTH_SHORT).show() }
                  else { bm.add(entry); Toast.makeText(this, R.string.add_bookmark, Toast.LENGTH_SHORT).show() }
                  prefs.edit().putStringSet("bookmarks_set", bm).apply()
                  updateBookmarkIcon()
              }

              private fun updateBookmarkIcon() {
                  val url = webView.url ?: return
                  val bm = prefs.getStringSet("bookmarks_set", mutableSetOf()) ?: mutableSetOf()
                  val marked = bm.any { it.endsWith("|$url") }
                  findViewById<ImageButton>(R.id.btnBookmark).setImageResource(
                      if (marked) android.R.drawable.btn_star_big_on else android.R.drawable.btn_star_big_off)
              }

              private fun saveHistory(url: String, title: String) {
                  if (url.startsWith("about:") || url.startsWith("data:")) return
                  val h = prefs.getStringSet("history_set", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  h.add("${System.currentTimeMillis()}|$title|$url")
                  if (h.size > 500) {
                      val s = h.sortedByDescending { it.substringBefore("|").toLongOrNull() ?: 0L }
                      prefs.edit().putStringSet("history_set", s.take(300).toMutableSet()).apply()
                  } else prefs.edit().putStringSet("history_set", h).apply()
              }

              private fun toggleIncognito() {
                  incognito = !incognito
                  incognitoBadge.visibility = if (incognito) View.VISIBLE else View.GONE
                  CookieManager.getInstance().setAcceptCookie(!incognito)
                  webView.settings.cacheMode = if (incognito) WebSettings.LOAD_NO_CACHE else WebSettings.LOAD_DEFAULT
                  webView.clearCache(incognito); webView.clearHistory(); showHomePage()
                  Toast.makeText(this, if (incognito) "Incognito ON" else "Incognito OFF", Toast.LENGTH_SHORT).show()
              }

              private fun showMainMenu() {
                  val opts = arrayOf("New Tab","Bookmarks","History","Find on page","Share page","Desktop site","Downloads","Ad Block Stats","Exit")
                  AlertDialog.Builder(this).setTitle("Menu").setItems(opts) { _, w ->
                      when (w) {
                          0 -> showHomePage()
                          1 -> showBookmarksDialog()
                          2 -> showHistoryDialog()
                          3 -> findOnPage()
                          4 -> sharePage()
                          5 -> toggleDesktopMode()
                          6 -> openDownloads()
                          7 -> showAdBlockStats()
                          8 -> finish()
                      }
                  }.show()
              }

              private fun showAdBlockStats() {
                  val b = blockedCount.get(); val t = totalCount.get()
                  val p = if (t > 0) (b * 100 / t) else 0
                  AlertDialog.Builder(this).setTitle("Ad Block Stats")
                      .setMessage("Total: $t\nBlocked: $b\nRate: $p%")
                      .setPositiveButton("OK", null).show()
              }

              private fun showBookmarksDialog() {
                  val set = prefs.getStringSet("bookmarks_set", mutableSetOf()) ?: mutableSetOf()
                  if (set.isEmpty()) { Toast.makeText(this, "No bookmarks", Toast.LENGTH_SHORT).show(); return }
                  val items = set.map { val p = it.split("|", limit = 2); (p.getOrNull(0) ?: it) to (p.getOrNull(1) ?: "") }
                  AlertDialog.Builder(this).setTitle("Bookmarks")
                      .setItems(items.map { it.first }.toTypedArray()) { _, w -> hideHomePage(); webView.loadUrl(items[w].second) }
                      .setNeutralButton("Clear") { _, _ -> prefs.edit().remove("bookmarks_set").apply(); updateBookmarkIcon() }
                      .show()
              }

              private fun showHistoryDialog() {
                  val set = prefs.getStringSet("history_set", mutableSetOf()) ?: mutableSetOf()
                  if (set.isEmpty()) { Toast.makeText(this, "No history", Toast.LENGTH_SHORT).show(); return }
                  val sorted = set.sortedByDescending { it.substringBefore("|").toLongOrNull() ?: 0L }.take(50)
                  val entries = sorted.map { val p = it.split("|", limit = 3); (p.getOrNull(1) ?: "Untitled") to (p.getOrNull(2) ?: "") }
                  AlertDialog.Builder(this).setTitle("History")
                      .setItems(entries.map { it.first }.toTypedArray()) { _, w -> hideHomePage(); webView.loadUrl(entries[w].second) }
                      .setNeutralButton("Clear") { _, _ -> prefs.edit().remove("history_set").apply() }.show()
              }

              private fun findOnPage() {
                  val i = EditText(this); i.hint = "Find text"
                  AlertDialog.Builder(this).setTitle("Find").setView(i)
                      .setPositiveButton("Find") { _, _ -> webView.findAllAsync(i.text.toString()) }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun sharePage() {
                  val url = webView.url ?: return
                  val i = Intent(Intent.ACTION_SEND); i.type = "text/plain"; i.putExtra(Intent.EXTRA_TEXT, url)
                  startActivity(Intent.createChooser(i, "Share via"))
              }

              private fun toggleDesktopMode() {
                  desktopMode = !desktopMode
                  webView.settings.userAgentString = if (desktopMode)
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                  else "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
                  webView.reload()
                  Toast.makeText(this, if (desktopMode) "Desktop mode" else "Mobile mode", Toast.LENGTH_SHORT).show()
              }

              private fun openDownloads() {
                  try { startActivity(Intent(DownloadManager.ACTION_VIEW_DOWNLOADS)) }
                  catch (e: Exception) { Toast.makeText(this, "Unavailable", Toast.LENGTH_SHORT).show() }
              }

              private fun showSettings() {
                  val hideId = prefs.getBoolean("hide_identity", false)
                  val js = prefs.getBoolean("javascript", true)
                  val vpn = isSystemVpnActive()
                  val opts = arrayOf(
                      "Dark mode: ${if (prefs.getBoolean("dark_mode", false)) "ON" else "OFF"}",
                      "Ad blocker: ${if (prefs.getBoolean("adblock", true)) "ON" else "OFF"}",
                      "🛡 Hide Identity: ${if (hideId) "ON" else "OFF"}",
                      "🔒 JavaScript: ${if (js) "ON" else "OFF"}",
                      "🌐 VPN: ${if (vpn) "CONNECTED" else "OFF"}",
                      "🌐 Open Cloudflare WARP (VPN)",
                      "Search engine: ${prefs.getString("search_engine", "google")}",
                      "Clear cache", "Clear cookies", "Reset all"
                  )
                  AlertDialog.Builder(this).setTitle("Settings").setItems(opts) { _, w ->
                      when (w) {
                          0 -> {
                              val d = !prefs.getBoolean("dark_mode", false)
                              prefs.edit().putBoolean("dark_mode", d).apply()
                              AppCompatDelegate.setDefaultNightMode(if (d) AppCompatDelegate.MODE_NIGHT_YES else AppCompatDelegate.MODE_NIGHT_NO)
                              recreate()
                          }
                          1 -> {
                              val a = !prefs.getBoolean("adblock", true)
                              prefs.edit().putBoolean("adblock", a).apply()
                              Toast.makeText(this, if (a) "ON" else "OFF", Toast.LENGTH_SHORT).show()
                          }
                          2 -> {
                              val h = !prefs.getBoolean("hide_identity", false)
                              prefs.edit().putBoolean("hide_identity", h).apply()
                              Toast.makeText(this, if (h) "🛡 Identity Protected" else "OFF", Toast.LENGTH_SHORT).show()
                              if (h) webView.reload()
                          }
                          3 -> {
                              val j = !prefs.getBoolean("javascript", true)
                              prefs.edit().putBoolean("javascript", j).apply()
                              webView.settings.javaScriptEnabled = j
                              Toast.makeText(this, if (j) "JS ON" else "JS OFF", Toast.LENGTH_SHORT).show()
                              webView.reload()
                          }
                          4 -> showVpnDialog()
                          5 -> openWarpApp()
                          6 -> chooseSearchEngine()
                          7 -> { webView.clearCache(true); Toast.makeText(this, "Cleared", Toast.LENGTH_SHORT).show() }
                          8 -> { CookieManager.getInstance().removeAllCookies(null); Toast.makeText(this, "Cleared", Toast.LENGTH_SHORT).show() }
                          9 -> { prefs.edit().clear().apply(); Toast.makeText(this, "Reset", Toast.LENGTH_SHORT).show(); recreate() }
                      }
                  }.show()
              }

              private fun chooseSearchEngine() {
                  val engines = arrayOf("google", "duckduckgo", "bing", "brave")
                  AlertDialog.Builder(this).setTitle("Search engine").setItems(engines) { _, w ->
                      prefs.edit().putString("search_engine", engines[w]).apply()
                      Toast.makeText(this, "Set to ${engines[w]}", Toast.LENGTH_SHORT).show()
                  }.show()
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState); webView.saveState(outState)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent); intent.data?.let { hideHomePage(); webView.loadUrl(it.toString()) }
              }

              override fun onBackPressed() {
                  if (!isHomeVisible && webView.canGoBack() && webView.url != "about:blank") webView.goBack()
                  else if (!isHomeVisible) showHomePage()
                  else super.onBackPressed()
              }
          }
          KOTEOF

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "=== APK Files ==="
          find . -name "*.apk" -type f

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusBrowser-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
