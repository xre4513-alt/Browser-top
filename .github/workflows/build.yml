              private fun navigate(input: String) {
                  val text = input.trim()
                  if (text.isEmpty()) return
                  val url = when {
                      text.startsWith("http://") || text.startsWith("https://") -> text
                      text.contains(".") && !text.contains(" ") -> "https://$text"
                      else -> {
                          val engine = prefs.getString("search_engine", "google") ?: "google"
                          val query = URLEncoder.encode(text, "UTF-8")
                          when (engine) {
                              "duckduckgo" -> "https://duckduckgo.com/?q=$query"
                              "bing" -> "https://www.bing.com/search?q=$query"
                              "brave" -> "https://search.brave.com/search?q=$query"
                              else -> "https://www.google.com/search?q=$query"
                          }
                      }
                  }
                  hideHomePage()
                  webView.loadUrl(url)
              }

              // ===== Proxy (VPN-like IP routing) =====
              private fun applyProxy() {
                  val proxyHost = prefs.getString("proxy_host", "") ?: ""
                  val proxyPort = prefs.getString("proxy_port", "") ?: ""
                  if (proxyHost.isEmpty() || proxyPort.isEmpty()) return
                  try {
                      if (WebViewFeature.isFeatureSupported(WebViewFeature.PROXY_OVERRIDE)) {
                          val proxyConfig = ProxyConfig.Builder()
                              .addProxyRule("$proxyHost:$proxyPort")
                              .addDirect()
                              .build()
                          ProxyController.getInstance().setProxyOverride(
                              proxyConfig,
                              Executors.newSingleThreadExecutor()
                          ) {
                              runOnUiThread { Toast.makeText(this, "VPN active via $proxyHost:$proxyPort", Toast.LENGTH_SHORT).show() }
                          }
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Proxy failed: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun clearProxy() {
                  try {
                      if (WebViewFeature.isFeatureSupported(WebViewFeature.PROXY_OVERRIDE)) {
                          ProxyController.getInstance().clearProxyOverride(
                              Executors.newSingleThreadExecutor()
                          ) { }
                      }
                  } catch (e: Exception) {}
              }

              private fun updateVpnStatus() {
                  val on = prefs.getBoolean("vpn_enabled", false)
                  vpnStatusText.text = if (on) {
                      val h = prefs.getString("proxy_host", "")
                      val p = prefs.getString("proxy_port", "")
                      if (h.isNullOrEmpty()) "VPN: ON (no proxy set)" else "VPN: ON ($h:$p)"
                  } else "VPN: OFF"
              }

              private fun setupButtons() {
                  findViewById<ImageButton>(R.id.btnBack).setOnClickListener {
                      if (webView.canGoBack()) webView.goBack()
                  }
                  findViewById<ImageButton>(R.id.btnForward).setOnClickListener {
                      if (webView.canGoForward()) webView.goForward()
                  }
                  findViewById<ImageButton>(R.id.btnRefresh).setOnClickListener { webView.reload() }
                  findViewById<ImageButton>(R.id.btnHome).setOnClickListener { showHomePage() }
                  findViewById<ImageButton>(R.id.btnBookmark).setOnClickListener { toggleBookmark() }
                  findViewById<ImageButton>(R.id.btnTabs).setOnClickListener { showHomePage() }
                  findViewById<ImageButton>(R.id.btnIncognito).setOnClickListener { toggleIncognito() }
                  findViewById<ImageButton>(R.id.btnSettings).setOnClickListener { showSettings() }
                  findViewById<ImageButton>(R.id.btnMenu).setOnClickListener { showMainMenu() }
              }

              private fun toggleBookmark() {
                  val url = webView.url ?: return
                  if (url == "about:blank") return
                  val title = webView.title ?: url
                  val bookmarks = prefs.getStringSet("bookmarks_set", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  val entry = "$title|$url"
                  val existing = bookmarks.firstOrNull { it.endsWith("|$url") }
                  if (existing != null) {
                      bookmarks.remove(existing)
                      Toast.makeText(this, R.string.remove_bookmark, Toast.LENGTH_SHORT).show()
                  } else {
                      bookmarks.add(entry)
                      Toast.makeText(this, R.string.add_bookmark, Toast.LENGTH_SHORT).show()
                  }
                  prefs.edit().putStringSet("bookmarks_set", bookmarks).apply()
                  updateBookmarkIcon()
              }

              private fun updateBookmarkIcon() {
                  val url = webView.url ?: return
                  val bookmarks = prefs.getStringSet("bookmarks_set", mutableSetOf()) ?: mutableSetOf()
                  val isBookmarked = bookmarks.any { it.endsWith("|$url") }
                  val btn = findViewById<ImageButton>(R.id.btnBookmark)
                  btn.setImageResource(
                      if (isBookmarked) android.R.drawable.btn_star_big_on
                      else android.R.drawable.btn_star_big_off
                  )
              }

              private fun saveHistory(url: String, title: String) {
                  if (url.startsWith("about:") || url.startsWith("data:")) return
                  val history = prefs.getStringSet("history_set", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  history.add("${System.currentTimeMillis()}|$title|$url")
                  if (history.size > 500) {
                      val sorted = history.sortedByDescending { it.substringBefore("|").toLongOrNull() ?: 0L }
                      prefs.edit().putStringSet("history_set", sorted.take(300).toMutableSet()).apply()
                  } else {
                      prefs.edit().putStringSet("history_set", history).apply()
                  }
              }

              private fun toggleIncognito() {
                  incognito = !incognito
                  incognitoBadge.visibility = if (incognito) View.VISIBLE else View.GONE
                  CookieManager.getInstance().setAcceptCookie(!incognito)
                  webView.settings.cacheMode = if (incognito) WebSettings.LOAD_NO_CACHE else WebSettings.LOAD_DEFAULT
                  webView.clearCache(incognito)
                  webView.clearHistory()
                  showHomePage()
                  Toast.makeText(this, if (incognito) "Incognito ON" else "Incognito OFF", Toast.LENGTH_SHORT).show()
              }

              private fun showMainMenu() {
                  val options = arrayOf(
                      "New Tab", "Bookmarks", "History", "Find on page",
                      "Share page", "Desktop site", "Downloads", "Ad Block Stats", "Exit"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Menu")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> showHomePage()
                              1 -> showBookmarksDialog()
                              2 -> showHistoryDialog()
                              3 -> findOnPage()
                              4 -> sharePage()
                              5 -> toggleDesktopMode()
                              6 -> openDownloads()
                              7 -> showAdBlockStats()
                              8 -> finish()
                          }
                      }
                      .show()
              }

              private fun showAdBlockStats() {
                  val blocked = blockedCount.get()
                  val total = totalCount.get()
                  val percentage = if (total > 0) (blocked * 100 / total) else 0
                  AlertDialog.Builder(this)
                      .setTitle("Ad Block Stats")
                      .setMessage("Total requests: $total\nBlocked ads: $blocked\nSuccess rate: $percentage%\n\nStatus: ${if(prefs.getBoolean("adblock", true)) "ON" else "OFF"}")
                      .setPositiveButton("OK", null)
                      .setNeutralButton("Reset") { _, _ ->
                          blockedCount.set(0); totalCount.set(0)
                          Toast.makeText(this, "Stats reset", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              private fun showBookmarksDialog() {
                  val set = prefs.getStringSet("bookmarks_set", mutableSetOf()) ?: mutableSetOf()
                  if (set.isEmpty()) { Toast.makeText(this, "No bookmarks", Toast.LENGTH_SHORT).show(); return }
                  val items = set.map {
                      val p = it.split("|", limit = 2)
                      (p.getOrNull(0) ?: it) to (p.getOrNull(1) ?: "")
                  }
                  val titles = items.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Bookmarks")
                      .setItems(titles) { _, w -> hideHomePage(); webView.loadUrl(items[w].second) }
                      .setNeutralButton("Clear") { _, _ ->
                          prefs.edit().remove("bookmarks_set").apply()
                          updateBookmarkIcon()
                      }
                      .show()
              }

              private fun showHistoryDialog() {
                  val set = prefs.getStringSet("history_set", mutableSetOf()) ?: mutableSetOf()
                  if (set.isEmpty()) { Toast.makeText(this, "No history", Toast.LENGTH_SHORT).show(); return }
                  val sorted = set.sortedByDescending { it.substringBefore("|").toLongOrNull() ?: 0L }.take(50)
                  val entries = sorted.map {
                      val p = it.split("|", limit = 3)
                      (p.getOrNull(1) ?: "Untitled") to (p.getOrNull(2) ?: "")
                  }
                  val titles = entries.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("History")
                      .setItems(titles) { _, w -> hideHomePage(); webView.loadUrl(entries[w].second) }
                      .setNeutralButton("Clear") { _, _ -> prefs.edit().remove("history_set").apply() }
                      .show()
              }

              private fun findOnPage() {
                  val input = EditText(this)
                  input.hint = "Find text"
                  AlertDialog.Builder(this)
                      .setTitle("Find on page")
                      .setView(input)
                      .setPositiveButton("Find") { _, _ -> webView.findAllAsync(input.text.toString()) }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun sharePage() {
                  val url = webView.url ?: return
                  val i = Intent(Intent.ACTION_SEND)
                  i.type = "text/plain"
                  i.putExtra(Intent.EXTRA_TEXT, url)
                  startActivity(Intent.createChooser(i, "Share via"))
              }

              private fun toggleDesktopMode() {
                  desktopMode = !desktopMode
                  webView.settings.userAgentString = if (desktopMode)
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                  else
                      "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
                  webView.reload()
                  Toast.makeText(this, if (desktopMode) "Desktop mode" else "Mobile mode", Toast.LENGTH_SHORT).show()
              }

              private fun openDownloads() {
                  try { startActivity(Intent(DownloadManager.ACTION_VIEW_DOWNLOADS)) }
                  catch (e: Exception) { Toast.makeText(this, "Downloads unavailable", Toast.LENGTH_SHORT).show() }
              }

              private fun showSettings() {
                  val hideId = prefs.getBoolean("hide_identity", false)
                  val js = prefs.getBoolean("javascript", true)
                  val vpn = prefs.getBoolean("vpn_enabled", false)
                  val options = arrayOf(
                      "Dark mode: ${if (prefs.getBoolean("dark_mode", false)) "ON" else "OFF"}",
                      "Ad blocker: ${if (prefs.getBoolean("adblock", true)) "ON" else "OFF"}",
                      "🛡 Hide Identity: ${if (hideId) "ON" else "OFF"}",
                      "🔒 JavaScript: ${if (js) "ON" else "OFF"}",
                      "🌐 VPN: ${if (vpn) "ON" else "OFF"}",
                      "VPN Proxy: ${prefs.getString("proxy_host", "not set")}:${prefs.getString("proxy_port", "")}",
                      "Search engine: ${prefs.getString("search_engine", "google")}",
                      "Clear cache", "Clear cookies", "Reset all"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Settings")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> {
                                  val d = !prefs.getBoolean("dark_mode", false)
                                  prefs.edit().putBoolean("dark_mode", d).apply()
                                  AppCompatDelegate.setDefaultNightMode(
                                      if (d) AppCompatDelegate.MODE_NIGHT_YES else AppCompatDelegate.MODE_NIGHT_NO)
                                  recreate()
                              }
                              1 -> {
                                  val a = !prefs.getBoolean("adblock", true)
                                  prefs.edit().putBoolean("adblock", a).apply()
                                  Toast.makeText(this, if (a) "Ad blocker ON" else "Ad blocker OFF", Toast.LENGTH_SHORT).show()
                              }
                              2 -> {
                                  val h = !prefs.getBoolean("hide_identity", false)
                                  prefs.edit().putBoolean("hide_identity", h).apply()
                                  if (h) {
                                      Toast.makeText(this, "🛡 Hide Identity ON — reload page", Toast.LENGTH_SHORT).show()
                                      webView.reload()
                                  } else {
                                      Toast.makeText(this, "Hide Identity OFF", Toast.LENGTH_SHORT).show()
                                  }
                              }
                              3 -> {
                                  val j = !prefs.getBoolean("javascript", true)
                                  prefs.edit().putBoolean("javascript", j).apply()
                                  webView.settings.javaScriptEnabled = j
                                  Toast.makeText(this, if (j) "JavaScript ON" else "JavaScript OFF", Toast.LENGTH_SHORT).show()
                                  webView.reload()
                              }
                              4 -> {
                                  val v = !prefs.getBoolean("vpn_enabled", false)
                                  prefs.edit().putBoolean("vpn_enabled", v).apply()
                                  if (v) {
                                      if (prefs.getString("proxy_host", "").isNullOrEmpty()) {
                                          Toast.makeText(this, "Set proxy first (option below)", Toast.LENGTH_LONG).show()
                                      } else applyProxy()
                                  } else clearProxy()
                                  updateVpnStatus()
                              }
                              5 -> setProxyDialog()
                              6 -> chooseSearchEngine()
                              7 -> { webView.clearCache(true); Toast.makeText(this, "Cache cleared", Toast.LENGTH_SHORT).show() }
                              8 -> { CookieManager.getInstance().removeAllCookies(null); Toast.makeText(this, "Cookies cleared", Toast.LENGTH_SHORT).show() }
                              9 -> {
                                  prefs.edit().clear().apply()
                                  clearProxy()
                                  Toast.makeText(this, "Reset done", Toast.LENGTH_SHORT).show()
                                  recreate()
                              }
                          }
                      }
                      .show()
              }

              private fun setProxyDialog() {
                  val layout = android.widget.LinearLayout(this)
                  layout.orientation = android.widget.LinearLayout.VERTICAL
                  layout.setPadding(40, 20, 40, 20)
                  val hostInput = EditText(this)
                  hostInput.hint = "Proxy host (e.g. 1.2.3.4)"
                  hostInput.setText(prefs.getString("proxy_host", ""))
                  val portInput = EditText(this)
                  portInput.hint = "Proxy port (e.g. 8080)"
                  portInput.setText(prefs.getString("proxy_port", ""))
                  layout.addView(hostInput)
                  layout.addView(portInput)
                  AlertDialog.Builder(this)
                      .setTitle("Set VPN Proxy")
                      .setMessage("Enter a SOCKS/HTTP proxy. IP will route through it.")
                      .setView(layout)
                      .setPositiveButton("Save") { _, _ ->
                          prefs.edit()
                              .putString("proxy_host", hostInput.text.toString().trim())
                              .putString("proxy_port", portInput.text.toString().trim())
                              .apply()
                          if (prefs.getBoolean("vpn_enabled", false)) applyProxy()
                          updateVpnStatus()
                          Toast.makeText(this, "Proxy saved", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun chooseSearchEngine() {
                  val engines = arrayOf("google", "duckduckgo", "bing", "brave")
                  AlertDialog.Builder(this)
                      .setTitle("Search engine")
                      .setItems(engines) { _, w ->
                          prefs.edit().putString("search_engine", engines[w]).apply()
                          Toast.makeText(this, "Set to ${engines[w]}", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  intent.data?.let { hideHomePage(); webView.loadUrl(it.toString()) }
              }

              override fun onBackPressed() {
                  if (!isHomeVisible && webView.canGoBack() && webView.url != "about:blank") {
                      webView.goBack()
                  } else if (!isHomeVisible) {
                      showHomePage()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          KOTEOF

      - name: Write NexusVpnService.kt
        run: |
          cat > app/src/main/java/com/nexus/browser/NexusVpnService.kt << 'KOTEOF'
          package com.nexus.browser

          import android.content.Intent
          import android.net.VpnService

          class NexusVpnService : VpnService() {
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  return START_STICKY
              }
              override fun onDestroy() {
                  super.onDestroy()
              }
          }
          KOTEOF

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "=== APK Files ==="
          find . -name "*.apk" -type f

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusBrowser-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
