              // ============ REQUEST LOG ============
              private fun showRequestLogDialog() {
                  if (requestLog.isEmpty()) {
                      AlertDialog.Builder(this)
                          .setTitle("📡 Network Requests")
                          .setMessage("No requests logged yet.\n\nBrowse a website and come back.")
                          .setPositiveButton("OK", null).show()
                      return
                  }
                  val snapshot = synchronized(requestLog) { requestLog.toList().reversed() }
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                  }
                  val summary = TextView(this).apply {
                      val blocked = snapshot.count { it.blocked }
                      text = "Total: ${snapshot.size}  |  Allowed: ${snapshot.size - blocked}  |  Blocked: $blocked"
                      setTextColor(Color.parseColor("#212121"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      setPadding(0, 0, 0, 12)
                  }
                  container.addView(summary)
                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(430))
                  }
                  val listLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val timeFmt = SimpleDateFormat("HH:mm:ss", Locale.getDefault())

                  snapshot.take(300).forEach { req ->
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(10), dp(8), dp(10), dp(8))
                          background = getDrawable(R.drawable.req_row_bg)
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply { bottomMargin = dp(4) }
                          isClickable = true; isFocusable = true
                          setOnClickListener {
                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              val text = "${req.method} ${req.url}\n\nType: ${req.resourceType}\nTime: ${timeFmt.format(Date(req.timestamp))}\nBlocked: ${req.blocked}"
                              cm.setPrimaryClip(ClipData.newPlainText("Nexus", text))
                              Toast.makeText(this@MainActivity, "Request copied", Toast.LENGTH_SHORT).show()
                          }
                      }
                      val header = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      }
                      val badge = TextView(this).apply {
                          text = if (req.blocked) "⛔" else "✓"
                          setTextColor(if (req.blocked) Color.parseColor("#F44336") else Color.parseColor("#4CAF50"))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f); setPadding(0, 0, dp(8), 0)
                      }
                      header.addView(badge)
                      val method = TextView(this).apply {
                          text = req.method
                          setTextColor(Color.parseColor("#1565C0"))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                          typeface = Typeface.DEFAULT_BOLD; setPadding(0, 0, dp(8), 0)
                      }
                      header.addView(method)
                      val type = TextView(this).apply {
                          text = req.resourceType
                          setTextColor(Color.parseColor("#757575"))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      header.addView(type)
                      val time = TextView(this).apply {
                          text = timeFmt.format(Date(req.timestamp))
                          setTextColor(Color.parseColor("#9E9E9E"))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 10f)
                      }
                      header.addView(time)
                      val urlView = TextView(this).apply {
                          text = req.url
                          setTextColor(if (req.blocked) Color.parseColor("#B71C1C") else Color.parseColor("#424242"))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                          maxLines = 2
                          ellipsize = android.text.TextUtils.TruncateAt.END
                          setPadding(0, dp(4), 0, 0)
                          typeface = Typeface.MONOSPACE
                      }
                      row.addView(header); row.addView(urlView)
                      listLayout.addView(row)
                  }
                  scroll.addView(listLayout)
                  container.addView(scroll)

                  AlertDialog.Builder(this)
                      .setTitle("📡 Network Requests")
                      .setView(container)
                      .setPositiveButton("Copy All") { _, _ ->
                          val sb = StringBuilder()
                          snapshot.forEach { r ->
                              sb.append(timeFmt.format(Date(r.timestamp))).append("  ")
                                  .append(if (r.blocked) "[BLOCKED] " else "[OK]      ")
                                  .append(r.method).append("  ").append(r.resourceType).append("  ")
                                  .append(r.url).append("\n")
                          }
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("Nexus", sb.toString()))
                          Toast.makeText(this, "Copied ${snapshot.size} requests", Toast.LENGTH_SHORT).show()
                      }
                      .setNeutralButton("Clear") { _, _ ->
                          synchronized(requestLog) { requestLog.clear() }
                          Toast.makeText(this, "Log cleared", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Close", null).show()
              }

