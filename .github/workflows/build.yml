              private var reqLiveHandler: Handler? = null
              private var reqLiveRunnable: Runnable? = null
              private var reqLiveList: LinearLayout? = null
              private var reqLiveSummary: TextView? = null
              private var reqLiveLastSize = -1

              private fun showReqLog() {
                  val c = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(20, 20, 20, 20) }
                  val summary = TextView(this).apply {
                      setTextColor(Color.parseColor("#212121"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f); setPadding(0, 0, 0, 12)
                      text = "Starting..."
                  }
                  reqLiveSummary = summary
                  c.addView(summary)
                  val sv = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(430))
                  }
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  sv.addView(list); c.addView(sv)
                  reqLiveList = list
                  val dlg = AlertDialog.Builder(this)
                      .setTitle("📡 Network Requests (LIVE)")
                      .setView(c)
                      .setPositiveButton("Copy All") { _, _ -> copyAllReqLog() }
                      .setNeutralButton("Clear") { _, _ ->
                          synchronized(reqLog) { reqLog.clear() }
                          reqLiveLastSize = -1
                          list.removeAllViews()
                          reqLiveSummary?.text = "Cleared • 🔴 LIVE"
                      }
                      .setNegativeButton("Close", null)
                      .create()
                  dlg.setOnDismissListener {
                      stopReqLive(); reqLiveList = null; reqLiveSummary = null
                  }
                  dlg.show()
                  rebuildReqList()
                  startReqLive()
              }

              private fun startReqLive() {
                  stopReqLive()
                  val h = Handler(Looper.getMainLooper())
                  reqLiveHandler = h
                  val r = object : Runnable {
                      override fun run() {
                          rebuildReqList()
                          reqLiveHandler?.postDelayed(this, 500)
                      }
                  }
                  reqLiveRunnable = r
                  h.postDelayed(r, 500)
              }

              private fun stopReqLive() {
                  reqLiveRunnable?.let { reqLiveHandler?.removeCallbacks(it) }
                  reqLiveRunnable = null; reqLiveHandler = null
              }

              private fun rebuildReqList() {
                  val list = reqLiveList ?: return
                  val summary = reqLiveSummary ?: return
                  val snap = synchronized(reqLog) { reqLog.toList() }
                  val sz = snap.size
                  if (sz == reqLiveLastSize) return
                  val blocked = snap.count { it.blocked }
                  summary.text = "🔴 LIVE • Total: $sz | Allowed: ${sz - blocked} | Blocked: $blocked"
                  val tf = SimpleDateFormat("HH:mm:ss", Locale.getDefault())
                  if (reqLiveLastSize < 0 || sz < reqLiveLastSize) {
                      list.removeAllViews()
                      snap.asReversed().take(200).forEach { r -> list.addView(makeReqRow(r, tf)) }
                  } else {
                      val diff = sz - reqLiveLastSize
                      val newItems = snap.takeLast(diff).reversed()
                      for (i in newItems.indices.reversed()) {
                          list.addView(makeReqRow(newItems[i], tf), 0)
                      }
                      while (list.childCount > 200) list.removeViewAt(list.childCount - 1)
                  }
                  reqLiveLastSize = sz
              }

              private fun makeReqRow(r: ReqEntry, tf: SimpleDateFormat): LinearLayout {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(10), dp(8), dp(10), dp(8))
                      background = getDrawable(R.drawable.req_row_bg)
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(4) }
                      isClickable = true; isFocusable = true
                      setOnClickListener { showReqOptions(r) }
                  }
                  val hdr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  hdr.addView(TextView(this).apply {
                      text = if (r.blocked) "⛔" else "✓"
                      setTextColor(if (r.blocked) Color.parseColor("#F44336") else Color.parseColor("#4CAF50"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f); setPadding(0, 0, dp(8), 0)
                  })
                  hdr.addView(TextView(this).apply {
                      text = r.method; setTextColor(Color.parseColor("#1565C0"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f); typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, dp(8), 0)
                  })
                  hdr.addView(TextView(this).apply {
                      text = r.rtype; setTextColor(Color.parseColor("#757575"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  })
                  hdr.addView(TextView(this).apply {
                      text = tf.format(Date(r.ts)); setTextColor(Color.parseColor("#9E9E9E"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10f)
                  })
                  row.addView(hdr)
                  row.addView(TextView(this).apply {
                      text = r.url
                      setTextColor(if (r.blocked) Color.parseColor("#B71C1C") else Color.parseColor("#424242"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f); maxLines = 2
                      ellipsize = android.text.TextUtils.TruncateAt.END
                      setPadding(0, dp(4), 0, 0); typeface = Typeface.MONOSPACE
                  })
                  return row
              }

              private fun copyAllReqLog() {
                  val snap = synchronized(reqLog) { reqLog.toList().reversed() }
                  val tf = SimpleDateFormat("HH:mm:ss", Locale.getDefault())
                  val sb = StringBuilder()
                  snap.forEach { r ->
                      sb.append(tf.format(Date(r.ts))).append("  ")
                          .append(if (r.blocked) "[BLOCKED] " else "[OK]      ")
                          .append(r.method).append("  ").append(r.rtype).append("  ")
                          .append(r.url).append("\n")
                  }
                  (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager)
                      .setPrimaryClip(ClipData.newPlainText("Nexus", sb.toString()))
                  Toast.makeText(this, "Copied ${snap.size} requests", Toast.LENGTH_SHORT).show()
              }

