              // ============ SERVER INFO ============
              private fun inspectServerInfo(url: String) {
                  Toast.makeText(this, "Fetching server info...", Toast.LENGTH_SHORT).show()
                  Thread {
                      val sb = StringBuilder()
                      try {
                          sb.append("URL: ").append(url).append("\n\n")
                          // Resolve IP first
                          try {
                              val host = Uri.parse(url).host ?: ""
                              sb.append("=== DNS ===\n")
                              sb.append("Host: ").append(host).append("\n")
                              val addrs = java.net.InetAddress.getAllByName(host)
                              addrs.forEachIndexed { i, a ->
                                  sb.append("IP ${i+1}: ").append(a.hostAddress).append("\n")
                              }
                              sb.append("\n")
                          } catch (e: Exception) {
                              sb.append("DNS lookup failed: ").append(e.message).append("\n\n")
                          }

                          // HEAD request
                          sb.append("=== SERVER HEADERS ===\n")
                          val conn = URL(url).openConnection() as HttpURLConnection
                          conn.requestMethod = "HEAD"
                          conn.connectTimeout = 10000
                          conn.readTimeout = 10000
                          conn.instanceFollowRedirects = false
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0 NexusBrowser/3.2")
                          conn.connect()

                          sb.append("Status: ").append(conn.responseCode).append(" ").append(conn.responseMessage).append("\n\n")
                          conn.headerFields.forEach { (key, values) ->
                              if (key != null && values != null) {
                                  values.forEach { v -> sb.append(key).append(": ").append(v).append("\n") }
                              }
                          }
                          conn.disconnect()

                          handler.post {
                              showCodeDialog("🌐 Server Info", sb.toString())
                          }
                      } catch (e: Exception) {
                          sb.append("\nERROR: ").append(e.message)
                          handler.post {
                              showCodeDialog("🌐 Server Info", sb.toString())
                          }
                      }
                  }.start()
              }

              private fun unescapeJsonString(s: String?): String {
                  if (s == null) return ""
                  if (s == "null") return "(empty)"
                  var str = s
                  if (str.startsWith("\"") && str.endsWith("\"") && str.length > 1) {
                      str = str.substring(1, str.length - 1)
                  }
                  return str
                      .replace("\\n", "\n")
                      .replace("\\t", "\t")
                      .replace("\\\"", "\"")
                      .replace("\\\\", "\\")
                      .replace("\\u003c", "<")
                      .replace("\\u003e", ">")
                      .replace("\\u0026", "&")
              }

              // Chunked code dialog — prevents crash on big content
              private fun showCodeDialog(title: String, content: String) {
                  val safe = if (content.length > 400000) content.substring(0, 400000) + "\n\n... [truncated]" else content
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                  }
