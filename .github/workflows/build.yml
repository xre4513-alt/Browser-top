              private fun guessType(url: String, main: Boolean): String {
                  if (main) return "document"
                  val l = url.lowercase().substringBefore("?")
                  return when {
                      l.endsWith(".css") -> "stylesheet"
                      l.endsWith(".js") || l.contains(".js?") -> "script"
                      l.endsWith(".png")||l.endsWith(".jpg")||l.endsWith(".jpeg")||l.endsWith(".gif")||l.endsWith(".webp")||l.endsWith(".svg")||l.endsWith(".ico") -> "image"
                      l.endsWith(".woff")||l.endsWith(".woff2")||l.endsWith(".ttf")||l.endsWith(".otf") -> "font"
                      l.endsWith(".mp4")||l.endsWith(".webm")||l.contains("videoplayback")||l.contains(".m3u8") -> "media"
                      l.endsWith(".json")||l.contains("/api/")||l.contains("/graphql") -> "xhr"
                      l.endsWith(".html")||l.endsWith(".htm") -> "document"
                      l.endsWith(".wasm") -> "wasm"
                      l.startsWith("ws://")||l.startsWith("wss://") -> "websocket"
                      else -> "other"
                  }
              }
              private fun logReq(url: String, method: String, blocked: Boolean, main: Boolean) {
                  if (logPaused) return
                  synchronized(reqLog) {
                      reqLog.add(ReqEntry(System.currentTimeMillis(), url, method, guessType(url, main), blocked, main))
                      if (reqLog.size > MAX_LOG) reqLog.removeAt(0)
                  }
              }

