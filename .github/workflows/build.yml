                  else createHomeTabInternal()

                  vpnPill.setOnClickListener { toggleVpn() }
                  homeSearchBar.clearFocus()
                  addressBar.clearFocus()

                  // start memory monitor
                  memHandler.post(memRunnable)
              }

              override fun onDestroy() {
                  memHandler.removeCallbacks(memRunnable)
                  super.onDestroy()
              }

              // ============ MEMORY MONITOR ============
              private fun getAppMemoryMB(): Int {
                  return try {
                      val runtime = Runtime.getRuntime()
                      val usedBytes = runtime.totalMemory() - runtime.freeMemory()
                      val debugInfo = Debug.MemoryInfo()
                      Debug.getMemoryInfo(debugInfo)
                      val totalPss = debugInfo.totalPss
                      if (totalPss > 0) totalPss / 1024 else (usedBytes / (1024 * 1024)).toInt()
                  } catch (e: Exception) {
                      try {
                          val runtime = Runtime.getRuntime()
                          ((runtime.totalMemory() - runtime.freeMemory()) / (1024 * 1024)).toInt()
                      } catch (e2: Exception) { 0 }
                  }
              }

              private fun getDeviceFreeMemoryMB(): Int {
                  return try {
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mi = ActivityManager.MemoryInfo()
                      am.getMemoryInfo(mi)
                      (mi.availMem / (1024 * 1024)).toInt()
                  } catch (e: Exception) { 0 }
              }

              private fun updateMemoryIndicator() {
                  val mem = getAppMemoryMB()
                  memIndicator.text = "${mem} MB"
                  val colorRes = when {
                      mem < 150 -> R.color.mem_ok
                      mem < 300 -> R.color.mem_warn
                      else -> R.color.mem_high
                  }
                  try {
                      memIndicator.setTextColor(getColor(colorRes))
                  } catch (e: Exception) {}
              }

              private fun showMemoryDetailDialog() {
                  val appMem = getAppMemoryMB()
                  val freeMem = getDeviceFreeMemoryMB()
                  val tabs = this.tabs.size
                  val wvCount = this.tabs.count { it.webView != null }

                  val msg = """
                      💾 Memory Usage
                      ────────────────
                      Browser (this app): $appMem MB
                      Device free RAM:    $freeMem MB
                      Open tabs:          $tabs
                      WebViews loaded:    $wvCount

                      ⚡ Low Memory Mode: ${if (lowMemoryMode) "ON" else "OFF"}
                      ${if (lowMemoryMode) "→ Cache reduced, background limited, images optional" else "→ Normal mode (full features)"}

                      Tap "Free Memory" to clear caches and free up RAM.
                  """.trimIndent()

                  AlertDialog.Builder(this)
                      .setTitle("💾 Memory Monitor")
                      .setMessage(msg)
                      .setPositiveButton("Free Memory") { _, _ ->
                          freeMemoryNow()
                      }
                      .setNeutralButton(if (lowMemoryMode) "Disable Low Mem" else "Enable Low Mem") { _, _ ->
                          toggleLowMemoryMode()
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              private fun freeMemoryNow() {
                  try {
                      tabs.forEach { it.webView?.clearCache(true) }
                      System.gc()
                      Runtime.getRuntime().gc()
                      updateMemoryIndicator()
                      Toast.makeText(this, "🧹 Memory freed!", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Failed: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun toggleLowMemoryMode() {
                  lowMemoryMode = !lowMemoryMode
                  prefs.edit().putBoolean("low_memory_mode", lowMemoryMode).apply()
                  applyLowMemoryMode()
                  val msg = if (lowMemoryMode)
                      "⚡ Low Memory Mode ON\n\nCache reduced • Background limited • Less RAM used"
                  else
                      "Normal mode restored\n\nFull features • Normal cache"
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show()
                  updateMemoryIndicator()
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun applyLowMemoryMode() {
                  tabs.forEach { tab ->
                      val wv = tab.webView ?: return@forEach
                      val s = wv.settings
                      if (lowMemoryMode) {
                          s.cacheMode = WebSettings.LOAD_CACHE_ELSE_NETWORK
                          s.blockNetworkImage = false
                          s.loadsImagesAutomatically = true
                          s.domStorageEnabled = false
                          s.databaseEnabled = false
                          s.setRenderPriority(WebSettings.RenderPriority.LOW)
                          wv.clearCache(true)
                      } else {
                          s.cacheMode = if (tab.isIncognito) WebSettings.LOAD_NO_CACHE else WebSettings.LOAD_DEFAULT
                          s.domStorageEnabled = true
                          s.databaseEnabled = true
                          s.setRenderPriority(WebSettings.RenderPriority.NORMAL)
                      }
                  }
                  // Kill extra unused renderer processes if API supports it
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && lowMemoryMode) {
                      try {
                          val wv = currentTab?.webView
                          wv?.clearFormData()
                          WebView.clearClientCertPreferences(null)
                      } catch (e: Exception) {}
                  }
              }

              private fun createHomeTabInternal() {
                  val tab = BrowserTab(isIncognito = false)
                  val wv = WebView(this)
                  configureWebView(wv, tab)
                  wv.layoutParams = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                  )
                  wv.visibility = View.GONE
                  contentContainer.addView(wv, 0)
                  tab.webView = wv
                  tabs.add(tab)
                  currentTabIndex = 0
                  homeOverlay.visibility = View.VISIBLE
                  isHomeVisible = true
                  addressBar.setText("")
                  incognitoBadge.visibility = View.GONE
                  renderTabStrip()
                  updateVpnUi()
                  applyLowMemoryMode()
              }

              private fun createTabInternal(loadUri: Uri) {
                  val tab = BrowserTab(isIncognito = false)
                  val wv = WebView(this)
                  configureWebView(wv, tab)
                  wv.layoutParams = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                  )
                  wv.visibility = View.VISIBLE
                  contentContainer.addView(wv, 0)
                  tab.webView = wv
                  tabs.add(tab)
                  currentTabIndex = 0
                  homeOverlay.visibility = View.GONE
                  isHomeVisible = false
                  loadIncoming(tab, loadUri)
                  renderTabStrip()
                  updateVpnUi()
              }

              private fun newTab(url: String = "about:blank", initialUri: Uri? = null) {
                  val tab = BrowserTab(isIncognito = false)
                  val wv = WebView(this)
                  configureWebView(wv, tab)
                  wv.layoutParams = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                  )
                  wv.visibility = View.GONE
                  contentContainer.addView(wv, 0)
                  tab.webView = wv
                  tabs.add(tab)
                  currentTabIndex = tabs.size - 1
                  tabs.forEachIndexed { i, t ->
                      t.webView?.visibility = if (i == currentTabIndex) View.VISIBLE else View.GONE
                  }
                  if (initialUri != null) {
                      homeOverlay.visibility = View.GONE
                      isHomeVisible = false
                      loadIncoming(tab, initialUri)
                  } else if (url != "about:blank") {
                      tab.isHome = false
                      homeOverlay.visibility = View.GONE
                      isHomeVisible = false
                      wv.loadUrl(url)
                  } else {
                      homeOverlay.visibility = View.VISIBLE
                      isHomeVisible = true
                      addressBar.setText("")
                  }
                  renderTabStrip()
                  updateBookmarkIcon()
              }

              private fun closeTab(index: Int) {
                  if (index < 0 || index >= tabs.size) return
                  val tab = tabs.removeAt(index)
                  contentContainer.removeView(tab.webView)
                  tab.webView?.destroy()
                  if (tabs.isEmpty()) { createHomeTabInternal(); return }
                  val newIdx = when {
                      currentTabIndex > index -> currentTabIndex - 1
                      currentTabIndex == index -> index.coerceAtMost(tabs.size - 1)
                      else -> currentTabIndex
                  }
                  switchToTab(newIdx)
                  if (lowMemoryMode) System.gc()
              }

              private fun switchToTab(index: Int) {
                  if (index < 0 || index >= tabs.size) return
                  currentTabIndex = index
                  tabs.forEachIndexed { i, tab ->
                      tab.webView?.visibility = if (i == index) View.VISIBLE else View.GONE
                  }
                  val tab = tabs[index]
                  if (tab.isHome) {
                      homeOverlay.visibility = View.VISIBLE
                      addressBar.setText("")
                      isHomeVisible = true
                  } else {
                      homeOverlay.visibility = View.GONE
                      isHomeVisible = false
                      addressBar.setText(tab.url)
                  }
                  incognitoBadge.visibility = if (tab.isIncognito) View.VISIBLE else View.GONE
                  updateBookmarkIcon()
                  renderTabStrip()
              }

              private fun showHome() {
                  val tab = currentTab ?: return
                  if (tab.isHome && isHomeVisible) return
                  tab.isHome = true
                  tab.url = "about:blank"
                  tab.title = "New Tab"
                  tab.webView?.visibility = View.GONE
                  homeOverlay.visibility = View.VISIBLE
                  isHomeVisible = true
                  addressBar.setText("")
                  incognitoBadge.visibility = if (tab.isIncognito) View.VISIBLE else View.GONE
                  updateBookmarkIcon()
                  renderTabStrip()
              }

              private fun hideHome() {
                  isHomeVisible = false
                  homeOverlay.visibility = View.GONE
              }

              private fun loadIncoming(tab: BrowserTab, uri: Uri) {
                  try {
                      val scheme = uri.scheme?.lowercase() ?: ""
                      when {
                          scheme == "http" || scheme == "https" || scheme == "ftp" -> {
                              tab.isHome = false
                              tab.url = uri.toString()
                              tab.webView?.visibility = View.VISIBLE
                              tab.webView?.loadUrl(uri.toString())
                          }
                          scheme == "file" || scheme == "content" -> {
                              val inputStream = contentResolver.openInputStream(uri)
                              val content = inputStream?.bufferedReader()?.use { it.readText() } ?: ""
                              tab.isHome = false
                              tab.title = uri.lastPathSegment ?: "Local file"
                              tab.url = uri.toString()
                              tab.webView?.visibility = View.VISIBLE
                              tab.webView?.loadDataWithBaseURL(null, content, "text/html", "UTF-8", null)
                          }
                          else -> {
                              tab.isHome = false
                              tab.url = uri.toString()
                              tab.webView?.visibility = View.VISIBLE
                              tab.webView?.loadUrl(uri.toString())
                          }
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Cannot open file: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun renderTabStrip() {
                  tabStrip.removeAllViews()
                  if (tabs.size <= 1) {
                      tabScroll.visibility = View.GONE
                      return
                  }
                  tabScroll.visibility = View.VISIBLE
                  tabs.forEachIndexed { i, tab ->
                      val isActive = i == currentTabIndex
                      val chip = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(12), 0, dp(6), 0)
                          background = getDrawable(
                              if (isActive) R.drawable.tab_chip_bg else R.drawable.tab_chip_inactive_bg
                          )
                          layoutParams = LinearLayout.LayoutParams(dp(150), dp(30)).apply { marginEnd = dp(4) }
                          elevation = if (isActive) dp(2).toFloat() else 0f
                      }
                      val title = TextView(this).apply {
                          text = if (tab.isIncognito) "🕵 ${tab.title}" else tab.title
                          maxLines = 1
                          ellipsize = android.text.TextUtils.TruncateAt.END
                          setTextColor(if (isActive) Color.parseColor("#1565C0") else Color.WHITE)
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      val close = TextView(this).apply {
                          text = "✕"
                          setTextColor(if (isActive) Color.parseColor("#1565C0") else Color.WHITE)
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                          setPadding(dp(6), 0, dp(4), 0)
                          gravity = Gravity.CENTER_VERTICAL
                          setOnClickListener { closeTab(i) }
                      }
                      chip.addView(title)
                      chip.addView(close)
                      chip.setOnClickListener { switchToTab(i) }
                      tabStrip.addView(chip)
                  }
                  val add = TextView(this).apply {
                      text = "+"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 22f)
                      gravity = Gravity.CENTER
                      setPadding(dp(12), 0, dp(12), 0)
                      layoutParams = LinearLayout.LayoutParams(dp(40), dp(30)).apply { marginEnd = dp(4) }
                      setOnClickListener { newTab() }
                  }
                  tabStrip.addView(add)
                  if (currentTabIndex >= 0 && tabStrip.childCount > 3) {
                      tabScroll.post {
                          val active = tabStrip.getChildAt(currentTabIndex) ?: return@post
                          tabScroll.scrollTo(active.left - dp(20), 0)
                      }
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun guessResourceType(url: String, isMainFrame: Boolean): String {
                  if (isMainFrame) return "document"
                  val lower = url.lowercase().substringBefore("?")
                  return when {
                      lower.endsWith(".css") -> "stylesheet"
                      lower.endsWith(".js") || lower.contains(".js?") -> "script"
                      lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg")
                          || lower.endsWith(".gif") || lower.endsWith(".webp") || lower.endsWith(".svg")
                          || lower.endsWith(".ico") -> "image"
                      lower.endsWith(".woff") || lower.endsWith(".woff2") || lower.endsWith(".ttf")
                          || lower.endsWith(".otf") -> "font"
                      lower.endsWith(".mp4") || lower.endsWith(".webm") || lower.endsWith(".mkv")
                          || lower.contains("videoplayback") || lower.contains(".m3u8") -> "media"
                      lower.endsWith(".json") || lower.contains("/api/") || lower.contains("/graphql") -> "xhr"
                      lower.endsWith(".html") || lower.endsWith(".htm") -> "document"
                      lower.endsWith(".wasm") -> "wasm"
                      lower.startsWith("ws://") || lower.startsWith("wss://") -> "websocket"
                      else -> "other"
                  }
              }

              private fun logRequest(url: String, method: String, blocked: Boolean, isMainFrame: Boolean) {
                  if (logPaused) return
                  val entry = RequestLogEntry(
                      timestamp = System.currentTimeMillis(),
                      url = url, method = method,
                      resourceType = guessResourceType(url, isMainFrame),
                      blocked = blocked, isMainFrame = isMainFrame
                  )
                  synchronized(requestLog) {
                      requestLog.add(entry)
                      if (requestLog.size > MAX_LOG_SIZE) requestLog.removeAt(0)
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun configureWebView(wv: WebView, tab: BrowserTab) {
                  val s = wv.settings
                  s.javaScriptEnabled = prefs.getBoolean("javascript", true)
                  s.domStorageEnabled = !lowMemoryMode
                  s.databaseEnabled = !lowMemoryMode
                  s.loadWithOverviewMode = true
                  s.useWideViewPort = true
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.setSupportZoom(true)
                  s.allowFileAccess = true
                  s.allowContentAccess = true
                  s.javaScriptCanOpenWindowsAutomatically = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.cacheMode = if (lowMemoryMode) WebSettings.LOAD_CACHE_ELSE_NETWORK
                                else if (tab.isIncognito) WebSettings.LOAD_NO_CACHE else WebSettings.LOAD_DEFAULT
                  s.userAgentString = s.userAgentString + " NexusBrowser/3.2"
                  s.setSupportMultipleWindows(true)

                  wv.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val url = request?.url?.toString() ?: return super.shouldInterceptRequest(view, request)
                          val method = request.method ?: "GET"
                          val isMainFrame = request.isForMainFrame
                          if (prefs.getBoolean("adblock", true)) {
                              totalCount.incrementAndGet()
                              if (isAdUrl(url)) {
                                  blockedCount.incrementAndGet()
                                  logRequest(url, method, true, isMainFrame)
                                  return WebResourceResponse("text/plain", "utf-8", ByteArrayInputStream(ByteArray(0)))
                              }
                          }
                          logRequest(url, method, false, isMainFrame)
                          return super.shouldInterceptRequest(view, request)
                      }

                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val url = request?.url?.toString() ?: return false
                          if (prefs.getBoolean("adblock", true) && isAdUrl(url)) {
                              logRequest(url, "GET", true, true); return true
                          }
                          if (url.startsWith("intent://")) {
                              try {
                                  val i = Intent.parseUri(url, Intent.URI_INTENT_SCHEME)
                                  startActivity(i); return true
                              } catch (e: Exception) { return false }
                          }
                          return false
                      }

                      override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                          super.onPageStarted(view, url, favicon)
                          tab.url = url ?: tab.url
                          if (url != null && url != "about:blank") {
                              tab.isHome = false
                              if (tab === currentTab) {
                                  addressBar.setText(url)
                                  homeOverlay.visibility = View.GONE
                                  isHomeVisible = false
                              }
                          }
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          tab.title = view?.title ?: (url ?: "Page")
                          if (!tab.isIncognito && url != null && url != "about:blank") saveHistory(url, view?.title ?: url)
                          if (tab === currentTab) {
                              updateBookmarkIcon()
                              renderTabStrip()
                          }
                          if (url == null || url == "about:blank") {
                              if (tab === currentTab && tab.isHome && homeOverlay.visibility != View.VISIBLE) {
                                  homeOverlay.visibility = View.VISIBLE
                                  isHomeVisible = true
                                  addressBar.setText("")
                              }
                              return
                          }
                          if (prefs.getBoolean("adblock", true)) {
                              injectUniversalAdBlock(view)
                              if (url.contains("youtube.com") || url.contains("youtu.be")) injectYouTubeAdBlock(view)
                          }
                          if (prefs.getBoolean("hide_identity", false)) injectHideIdentity(view)
                      }
                  }

                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          if (tab === currentTab) {
                              progressBar.progress = newProgress
                              progressBar.visibility = if (newProgress in 1..99) View.VISIBLE else View.GONE
                          }
                      }
                  }

                  wv.setDownloadListener(DownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                      try {
                          val filename = URLUtil.guessFileName(url, contentDisposition, mimeType)
                          val request = DownloadManager.Request(Uri.parse(url))
                          request.setMimeType(mimeType)
                          request.addRequestHeader("User-Agent", userAgent)
                          request.addRequestHeader("cookie", CookieManager.getInstance().getCookie(url))
                          request.setDescription("Downloading..."); request.setTitle(filename)
                          request.allowScanningByMediaScanner()
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, filename)
                          val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                          dm.enqueue(request)
                          Toast.makeText(this, R.string.download_started, Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Download failed: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  })
              }

              private fun setupInputs() {
                  addressBar.setOnEditorActionListener { _, actionId, event ->
                      if (actionId == EditorInfo.IME_ACTION_GO || event?.keyCode == KeyEvent.KEYCODE_ENTER) {
                          navigate(addressBar.text.toString()); addressBar.clearFocus(); true
                      } else false
                  }
                  homeSearchBar.setOnEditorActionListener { _, actionId, event ->
                      if (actionId == EditorInfo.IME_ACTION_GO || event?.keyCode == KeyEvent.KEYCODE_ENTER) {
                          val q = homeSearchBar.text.toString()
                          if (q.isNotEmpty()) { navigate(q); homeSearchBar.clearFocus() }
                          true
                      } else false
                  }
              }

              private fun navigate(input: String) {
                  val text = input.trim()
                  if (text.isEmpty()) return
                  val url = when {
                      text.startsWith("http://") || text.startsWith("https://") -> text
                      text.contains(".") && !text.contains(" ") -> "https://$text"
                      else -> {
                          val engine = prefs.getString("search_engine", "google") ?: "google"
                          val query = URLEncoder.encode(text, "UTF-8")
                          when (engine) {
                              "duckduckgo" -> "https://duckduckgo.com/?q=$query"
                              "bing" -> "https://www.bing.com/search?q=$query"
                              "brave" -> "https://search.brave.com/search?q=$query"
                              else -> "https://www.google.com/search?q=$query"
                          }
                      }
                  }
                  val tab = currentTab ?: return
                  tab.isHome = false
                  hideHome()
                  tab.webView?.visibility = View.VISIBLE
                  tab.webView?.loadUrl(url)
                  renderTabStrip()
              }

              private fun setupButtons() {
                  findViewById<ImageButton>(R.id.btnBack).setOnClickListener { onBackPressed() }
                  findViewById<ImageButton>(R.id.btnForward).setOnClickListener {
                      val wv = currentTab?.webView
                      if (wv != null && wv.canGoForward()) wv.goForward()
                  }
                  findViewById<ImageButton>(R.id.btnRefresh).setOnClickListener { currentTab?.webView?.reload() }
                  findViewById<ImageButton>(R.id.btnHome).setOnClickListener { showHome() }
                  findViewById<ImageButton>(R.id.btnBookmark).setOnClickListener { toggleBookmark() }
                  findViewById<ImageButton>(R.id.btnTabs).setOnClickListener { showTabsDialog() }
                  findViewById<ImageButton>(R.id.btnIncognito).setOnClickListener { toggleIncognitoForTab() }
                  findViewById<ImageButton>(R.id.btnSettings).setOnClickListener { showSettings() }
                  findViewById<ImageButton>(R.id.btnMenu).setOnClickListener { showMainMenu() }
              }

              // ============ INSPECT MODE ============
              private fun showInspectDialog() {
                  val tab = currentTab ?: return
                  val wv = tab.webView ?: return
                  val url = wv.url ?: "about:blank"
                  if (url == "about:blank" || tab.isHome) {
                      Toast.makeText(this, "Open a website first", Toast.LENGTH_SHORT).show(); return
                  }
                  val options = arrayOf(
                      "📄 Page HTML Source (fast)",
                      "🍪 Cookies",
                      "💾 LocalStorage",
                      "📊 Page Info",
                      "🖼️ All Links (href)",
                      "🔗 All Images (src)",
                      "📜 Scripts & Styles",
                      "🌐 Server Info (headers, IP, CDN)"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("🔍 Inspect: ${tab.title.take(30)}")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> inspectHtmlSource(wv)
                              1 -> inspectCookies(url)
                              2 -> inspectLocalStorage(wv)
                              3 -> inspectPageInfo(wv)
                              4 -> inspectLinks(wv)
                              5 -> inspectImages(wv)
                              6 -> inspectScriptsStyles(wv)
                              7 -> inspectServerInfo(url)
                          }
                      }
                      .setNegativeButton("Close", null).show()
              }

              // FIXED - Fast HTML inspector with 500KB cap + background thread
              private fun inspectHtmlSource(wv: WebView) {
                  Toast.makeText(this, "Extracting HTML (max 500 KB)...", Toast.LENGTH_SHORT).show()
                  wv.evaluateJavascript(
                      "(function(){ try { var h = document.documentElement.outerHTML; if (!h) return 'ERROR:empty'; if (h.length > 500000) { return h.substring(0, 500000) + '\\n\\n... [TRUNCATED at 500KB — total ' + h.length + ' chars]'; } return h; } catch(e) { return 'ERROR: ' + (e.message||'unknown'); } })()"
                  ) { result ->
                      try {
                          val html = unescapeJsonString(result)
                          showCodeDialog("HTML Source (${html.length} chars)", html)
                      } catch (e: Throwable) {
                          Toast.makeText(this, "Parse error: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun inspectCookies(url: String) {
                  try {
                      val cookie = CookieManager.getInstance().getCookie(url)
                      val text = if (cookie.isNullOrEmpty()) "No cookies for this site.\n\n$url"
                                 else cookie.split(";").joinToString("\n\n") { it.trim() }
                      showCodeDialog("Cookies (${if (cookie.isNullOrEmpty()) 0 else cookie.split(";").size})", text)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Cookie error: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun inspectLocalStorage(wv: WebView) {
                  wv.evaluateJavascript(
                      "(function(){ try { var out=''; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); out += k + ' = ' + localStorage.getItem(k) + '\\n\\n'; } return out || 'LocalStorage is empty.'; } catch(e){ return 'ERROR: '+e.message; } })()"
                  ) { result -> showCodeDialog("LocalStorage", unescapeJsonString(result)) }
              }

              private fun inspectPageInfo(wv: WebView) {
                  wv.evaluateJavascript(
                      "(function(){ try { return JSON.stringify({ title: document.title, url: location.href, host: location.host, protocol: location.protocol, referrer: document.referrer, charset: document.characterSet, size: document.documentElement.outerHTML.length, links: document.links.length, images: document.images.length, scripts: document.scripts.length, forms: document.forms.length, meta: document.querySelectorAll('meta').length }); } catch(e){ return '{}'; } })()"
                  ) { result ->
                      val info = unescapeJsonString(result)
                      val pretty = info.replace(",", ",\n").replace("{", "{\n").replace("}", "\n}")
                      showCodeDialog("Page Info", pretty)
                  }
              }

