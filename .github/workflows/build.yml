name: Build Nexus Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Create structure
        run: |
          mkdir -p app/src/main/java/com/nexus/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
      - name: settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NexusBrowser"
          include ':app'
          EOF
      - name: root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
      - name: gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF
      - name: app build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.nexus.browser'
              compileSdk 34
              defaultConfig {
                  applicationId "com.nexus.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 15
                  versionName "4.0.0"
                  multiDexEnabled true
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug { applicationIdSuffix ".debug" }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true }
              packagingOptions {
                  resources.excludes += '/META-INF/{AL2.0,LGPL2.1,DEPENDENCIES,LICENSE,LICENSE.txt,NOTICE,NOTICE.txt}'
                  jniLibs.pickFirsts += ['**/libwg-go.so']
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'com.wireguard.android:tunnel:1.0.20230706'
              implementation 'androidx.annotation:annotation:1.7.1'
              implementation 'androidx.collection:collection:1.4.0'
          }
          EOF
      - name: proguard
        run: |
          cat > app/proguard-rules.pro << 'EOF'
          -keep class com.nexus.browser.** { *; }
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }
          -keep class com.wireguard.** { *; }
          -dontwarn com.wireguard.**
          -keep class go.** { *; }
          -dontwarn go.**
          EOF
      - name: Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.DOWNLOAD_WITHOUT_NOTIFICATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries>
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Nexus Browser"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/AppTheme"
                  tools:targetApi="34">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustNothing">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" /><data android:scheme="https" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="file" /><data android:mimeType="text/html" />
                      </intent-filter>
                  </activity>
                  <service android:name=".VpnServiceX"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false" android:foregroundServiceType="specialUse">
                      <intent-filter><action android:name="android.net.VpnService" /></intent-filter>
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="vpn" />
                  </service>
                  <provider android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF
      - name: file_paths
        run: |
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="ext" path="." />
              <external-files-path name="extapp" path="." />
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF
      - name: strings
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Nexus Browser</string></resources>
          EOF
      - name: colors
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="primary">#1565C0</color>
              <color name="primary_dark">#0D47A1</color>
              <color name="accent">#00BFA5</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
              <color name="incognito">#311B92</color>
              <color name="vpn_on">#00C853</color>
              <color name="vpn_off">#F44336</color>
              <color name="data_ok">#4CAF50</color>
              <color name="data_warn">#FF9800</color>
              <color name="data_high">#F44336</color>
          </resources>
          EOF
      - name: theme
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:statusBarColor">@color/primary_dark</item>
                  <item name="android:navigationBarColor">@color/primary_dark</item>
              </style>
          </resources>
          EOF
      - name: icons
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1565C0" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,20 C35,20 20,35 20,54 C20,73 35,88 54,88 C73,88 88,73 88,54 C88,35 73,20 54,20 Z M54,80 C39.6,80 28,68.4 28,54 C28,39.6 39.6,28 54,28 C68.4,28 80,39.6 80,54 C80,68.4 68.4,80 54,80 Z"/>
              <path android:fillColor="#00BFA5" android:pathData="M54,34 C43,34 34,43 34,54 C34,65 43,74 54,74 C65,74 74,65 74,54 C74,43 65,34 54,34 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M50,44 L50,64 L66,54 Z"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/pill.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#22FFFFFF" /><corners android:radius="14dp" />
          </shape>
          EOF
          cat > app/src/main/res/drawable/search_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" /><corners android:radius="24dp" />
          </shape>
          EOF
          cat > app/src/main/res/drawable/code_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1E1E1E" /><corners android:radius="8dp" />
          </shape>
          EOF
          cat > app/src/main/res/drawable/req_row_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FAFAFA" /><corners android:radius="6dp" />
              <stroke android:width="1dp" android:color="#E0E0E0" />
          </shape>
          EOF
      - name: Layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#F0F4F8">
              <LinearLayout android:id="@+id/navBar" android:layout_width="match_parent" android:layout_height="56dp"
                  android:orientation="horizontal" android:background="@color/primary" android:gravity="center_vertical"
                  android:elevation="4dp" android:paddingStart="4dp" android:paddingEnd="4dp">
                  <ImageButton android:id="@+id/btnBack" android:layout_width="42dp" android:layout_height="42dp"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:src="@android:drawable/ic_media_previous" android:scaleType="centerInside" android:padding="10dp" />
                  <ImageButton android:id="@+id/btnForward" android:layout_width="42dp" android:layout_height="42dp"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:src="@android:drawable/ic_media_next" android:scaleType="centerInside" android:padding="10dp" />
                  <ImageButton android:id="@+id/btnRefresh" android:layout_width="42dp" android:layout_height="42dp"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:src="@android:drawable/ic_menu_rotate" android:scaleType="centerInside" android:padding="10dp" />
                  <LinearLayout android:layout_width="0dp" android:layout_height="42dp" android:layout_weight="1"
                      android:orientation="horizontal" android:gravity="center_vertical"
                      android:background="@drawable/search_bg" android:layout_marginStart="2dp" android:layout_marginEnd="2dp">
                      <EditText android:id="@+id/addressBar" android:layout_width="match_parent" android:layout_height="match_parent"
                          android:background="@android:color/transparent" android:hint="Search or type URL"
                          android:textColorHint="#9E9E9E" android:textColor="#212121"
                          android:paddingStart="16dp" android:paddingEnd="16dp" android:imeOptions="actionGo"
                          android:inputType="textUri" android:maxLines="1" android:textSize="13sp" />
                  </LinearLayout>
                  <TextView android:id="@+id/dataIndicator" android:layout_width="wrap_content" android:layout_height="26dp"
                      android:gravity="center" android:paddingStart="8dp" android:paddingEnd="8dp"
                      android:background="@drawable/pill" android:text="0 B" android:textColor="#FFFFFF"
                      android:textSize="10sp" android:textStyle="bold" android:layout_marginEnd="2dp" />
                  <ImageButton android:id="@+id/btnMenu" android:layout_width="38dp" android:layout_height="42dp"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:src="@android:drawable/ic_menu_more" android:scaleType="centerInside" android:padding="10dp" />
              </LinearLayout>
              <HorizontalScrollView android:id="@+id/tabScroll" android:layout_width="match_parent" android:layout_height="38dp"
                  android:background="@color/primary_dark" android:scrollbars="none">
                  <LinearLayout android:id="@+id/tabStrip" android:layout_width="wrap_content" android:layout_height="match_parent"
                      android:orientation="horizontal" android:gravity="center_vertical"
                      android:paddingStart="6dp" android:paddingEnd="6dp" />
