              private fun downloadRequestContent(r: ReqEntry) {
                  val pageUrl = cur?.wv?.url ?: ""
                  Toast.makeText(this, "Downloading...", Toast.LENGTH_SHORT).show()
                  Thread {
                      try {
                          val conn = URL(r.url).openConnection() as HttpURLConnection
                          conn.requestMethod = r.method
                          conn.connectTimeout = 15000
                          conn.readTimeout = 30000
                          conn.instanceFollowRedirects = true
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 NexusBrowser/4.0")
                          val host = try { Uri.parse(r.url).host ?: "" } catch (e: Exception) { "" }
                          if (pageUrl.isNotEmpty() && pageUrl.contains(host)) {
                              val cookies = CookieManager.getInstance().getCookie(pageUrl)
                              if (!cookies.isNullOrEmpty()) conn.setRequestProperty("Cookie", cookies)
                          }
                          conn.connect()
                          val code = conn.responseCode
                          if (code !in 200..299) {
                              handler.post { Toast.makeText(this, "HTTP $code", Toast.LENGTH_LONG).show() }
                              return@Thread
                          }
                          var fname = Uri.parse(r.url).lastPathSegment ?: "response.dat"
                          if (!fname.contains(".")) {
                              fname = when (r.rtype) {
                                  "xhr" -> "response.json"
                                  "document" -> "page.html"
                                  else -> "response.dat"
                              }
                          }
                          fname = fname.replace(Regex("[^a-zA-Z0-9._-]"), "_")
                          if (fname.length > 100) fname = fname.take(90) + ".dat"
                          val bytes = conn.inputStream.readBytes()
                          conn.disconnect()
                          val mime = when (r.rtype) {
                              "xhr" -> "application/json"
                              "document" -> "text/html"
                              else -> "application/octet-stream"
                          }
                          val savedPath = saveBytesToDownloads(bytes, fname, mime)
                          handler.post {
                              if (savedPath != null) {
                                  AlertDialog.Builder(this)
                                      .setTitle("✅ Downloaded")
                                      .setMessage("File: $fname\nSize: ${bytes.size} bytes\n\nPath:\n$savedPath\n\nFiles app > Downloads > NexusDownloads me milega")
                                      .setPositiveButton("OK", null)
                                      .setNeutralButton("Share") { _, _ ->
                                          val i = Intent(Intent.ACTION_SEND)
                                          i.type = "text/plain"
                                          i.putExtra(Intent.EXTRA_TEXT, savedPath)
                                          startActivity(Intent.createChooser(i, "Share"))
                                      }
                                      .show()
                              } else {
                                  Toast.makeText(this, "❌ Save failed (all methods)", Toast.LENGTH_LONG).show()
                              }
                          }
                      } catch (e: Exception) {
                          handler.post { Toast.makeText(this, "Failed: ${e.message}", Toast.LENGTH_LONG).show() }
                      }
                  }.start()
              }

              private fun viewRequestContent(r: ReqEntry) {
                  val pageUrl = cur?.wv?.url ?: ""
                  Toast.makeText(this, "Fetching...", Toast.LENGTH_SHORT).show()
                  Thread {
                      try {
                          val conn = URL(r.url).openConnection() as HttpURLConnection
                          conn.requestMethod = r.method
                          conn.connectTimeout = 15000
                          conn.readTimeout = 30000
                          conn.instanceFollowRedirects = true
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 NexusBrowser/4.0")
                          val host = try { Uri.parse(r.url).host ?: "" } catch (e: Exception) { "" }
                          if (pageUrl.isNotEmpty() && pageUrl.contains(host)) {
                              val cookies = CookieManager.getInstance().getCookie(pageUrl)
                              if (!cookies.isNullOrEmpty()) conn.setRequestProperty("Cookie", cookies)
                          }
                          conn.connect()
                          val code = conn.responseCode
                          val text = try { conn.inputStream.bufferedReader().use { it.readText() } } catch (e: Exception) { "Error: ${e.message}" }
