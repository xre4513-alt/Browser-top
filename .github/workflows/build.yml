              private fun saveHistory(url: String, title: String) {
                  if (url.startsWith("about:") || url.startsWith("data:")) return
                  val h = prefs.getStringSet("history_set", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  h.add("${System.currentTimeMillis()}|$title|$url")
                  if (h.size > 500) {
                      val s = h.sortedByDescending { it.substringBefore("|").toLongOrNull() ?: 0L }
                      prefs.edit().putStringSet("history_set", s.take(300).toMutableSet()).apply()
                  } else prefs.edit().putStringSet("history_set", h).apply()
              }

