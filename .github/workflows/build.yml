              private fun loadUri(t: Tab, uri: Uri) {
                  try {
                      val sc = uri.scheme?.lowercase() ?: ""
                      when {
                          sc == "http" || sc == "https" || sc == "ftp" -> {
                              t.isHome = false; t.url = uri.toString()
                              t.wv?.visibility = View.VISIBLE; t.wv?.loadUrl(uri.toString())
                          }
                          sc == "file" || sc == "content" -> {
                              val txt = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""
                              t.isHome = false; t.title = uri.lastPathSegment ?: "File"
                              t.url = uri.toString(); t.wv?.visibility = View.VISIBLE
                              t.wv?.loadDataWithBaseURL(null, txt, "text/html", "UTF-8", null)
                          }
                          else -> {
                              t.isHome = false; t.url = uri.toString()
                              t.wv?.visibility = View.VISIBLE; t.wv?.loadUrl(uri.toString())
                          }
                      }
                  } catch (e: Exception) { Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_LONG).show() }
              }
              private fun renderTabs() {
                  tabStrip.removeAllViews()
                  if (tabs.size <= 1) { tabScroll.visibility = View.GONE; return }
                  tabScroll.visibility = View.VISIBLE
                  tabs.forEachIndexed { i, t ->
                      val act = i == curIdx
                      val chip = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(12), 0, dp(6), 0)
                          setBackgroundColor(if (act) Color.WHITE else Color.parseColor("#33FFFFFF"))
